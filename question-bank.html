{"c":15,"q":"Why does Cabernet Sauvignon need a long, warm growing season?","o":["Its thin skins rot easily in cool weather","Its thick skins need it to ripen fully","Its grapes are naturally low in acidity","It needs heat to build up botrytis"],"a":1,"e":"Cabernet's thick skins hold lots of colour, flavour and tannin, and they need a long, warm season to ripen fully. The thin-skinned, rot-prone grape is Pinot Noir.","x":1},
{"c":15,"q":"Cabernet Sauvignon is a black grape that comes from:","o":["Northern Italy","Northern Spain","California","South-west France"],"a":3,"e":"It's from south-west France and is behind many of the famous Left Bank Bordeaux wines. Napa makes outstanding Cabernet, but that's where it was planted later.","x":1},
{"c":15,"q":"Why is Cabernet Sauvignon so often matured in oak barrels?","o":["Oak raises the alcohol","Oak adds acidity to balance the fruit","Small amounts of oxygen soften its tannins","Oak removes its green pepper notes"],"a":2,"e":"Newly fermented Cabernet can taste unpleasantly tannic. Oak lets in a little oxygen, which softens the tannins, and new oak adds smoke, vanilla and cloves too.","x":1},
{"c":15,"q":"New-oak barrels give Cabernet Sauvignon secondary flavours of:","o":["Bread and biscuit","Dried fruit and forest floor","Smoke, vanilla and cloves","Butter and cream"],"a":2,"e":"New oak gives smoke, vanilla and cloves. Dried fruit, earth and forest floor come later, from bottle age, so they're tertiary.","x":1},
{"c":15,"q":"France's most important area for Cabernet Sauvignon-dominated blends is:","o":["The Northern Rhône","The Left Bank of Bordeaux","The Right Bank of Bordeaux","Burgundy"],"a":1,"e":"Cabernet-dominated blends are the Left Bank's speciality. The Right Bank is the obvious trap: same region, but Merlot leads there.","x":1},
{"c":15,"q":"Which of these is not a Left Bank appellation for Cabernet-dominated blends?","o":["Pauillac AOC","Pessac-Léognan AOC","Saint-Émilion AOC","Margaux AOC"],"a":2,"e":"The book's Left Bank list is Médoc, Haut-Médoc (with Margaux and Pauillac inside it), Graves and Pessac-Léognan. Saint-Émilion is Right Bank, where Merlot leads.","x":1},
{"c":15,"q":"On a Bordeaux label, what do 'Grand Cru Classé' or 'Cru Classé' tell you?","o":["The grapes came from the producer's own land","The wine comes from a single grand cru vineyard","The wine is from the Médoc but not classified","The château is ranked in a local classification of the best wines"],"a":3,"e":"Some Bordeaux sub-regions rank their best châteaux, and those classified wines can use Grand Cru Classé or Cru Classé. Burgundy uses grand cru for single vineyards, which is a different system.","x":1},
{"c":15,"q":"Why is single-varietal Cabernet Sauvignon possible in the South of France?","o":["Only Cabernet is allowed there","Blending is banned there","It's cooler than Bordeaux","The warm, steady climate lets it ripen reliably"],"a":3,"e":"The South of France is warm and its weather varies less than Bordeaux's, so Cabernet ripens reliably. You'll find it on its own and blended with Merlot and others.","x":1},
{"c":15,"q":"Which two neighbouring Californian regions make many very good to outstanding Cabernet Sauvignons?","o":["Napa Valley and Sonoma","Central Valley and Napa Valley","Oregon and Sonoma","Carneros and Santa Barbara County"],"a":0,"e":"The book names Napa Valley and Sonoma. Napa's warm, sunny, long season is ideal for Cabernet, and the warmer inland parts of Sonoma make similarly powerful wines.","x":1},
{"c":15,"q":"Which two Napa Valley sub-regions are known for full-bodied Cabernet with ripe black fruit and high, ripe tannins?","o":["Carneros and Sonoma","Coonawarra and Margaret River","Oakville and Rutherford","Maipo and Colchagua"],"a":2,"e":"Oakville and Rutherford are the two the book names. Calistoga, further north, is warmer still and gives some of Napa's ripest wines.","x":1},
{"c":15,"q":"A Cabernet Sauvignon labelled simply 'California' is typically:","o":["Blended from across the state, mostly hot Central Valley fruit, made to drink now","From a single top Napa vineyard, built to age","From cool Carneros fruit","Always unoaked"],"a":0,"e":"'California' means the grapes can come from anywhere in the state, and much of it is hot, irrigated Central Valley fruit. These wines are for drinking now and may get oak flavour from chips or staves.","x":1},
{"c":15,"q":"Chile's Maipo and Colchagua Valleys run from the Andes foothills to the Coastal Ranges. Why does that matter?","o":["It means every wine tastes of mint","It gives producers a broad range of sites to choose from","It stops all irrigation","It makes every vineyard cool enough for Pinot Noir"],"a":1,"e":"Running across from mountains to coast, with flatter, fertile valley floors in between, gives a wide choice of sites. The foothill wines often show mint and green pepper.","x":1},
{"c":15,"q":"In Chile, Cabernet Sauvignon is blended with Merlot and which local speciality?","o":["Tempranillo","Carmenère","Malbec","Pinotage"],"a":1,"e":"The book calls Carmenère Chile's local speciality. Pinotage and Malbec are the specialities of South Africa and Argentina.","x":1},
{"c":15,"q":"Why can Stellenbosch make Cabernet in styles from fresh and herbal to full-bodied and cooked?","o":["It's mountainous, so the climate runs from moderate to warm with altitude","It's cooled by fog from San Pablo Bay","It has cloud cover and cool southerly breezes","It's one flat, very hot valley"],"a":0,"e":"Stellenbosch is mountainous, so vineyard altitude changes the climate from moderate to warm, and the styles follow: fresher and herbal up high, fuller and riper lower down.","x":1},
{"c":15,"q":"Which two Australian regions are known for high-quality Cabernet Sauvignon?","o":["Clare Valley and Eden Valley","Barossa Valley and McLaren Vale","Coonawarra and Margaret River","Yarra Valley and Mornington Peninsula"],"a":2,"e":"Margaret River in Western Australia and Coonawarra in South Australia. Barossa is the tempting one, but the book ties it to Shiraz and Grenache.","x":1},
{"c":15,"q":"What moderates the warm Margaret River region for Cabernet Sauvignon?","o":["Morning fog from the Pacific","Coastal breezes and plentiful winter rainfall","High altitude","Cloud cover and cool breezes from the south"],"a":1,"e":"Margaret River is warm but moderated by coastal breezes and plentiful winter rain. Its Cabernet shows ripe black fruit and subtle oak, and it's sometimes blended with Merlot.","x":1},
{"c":20,"q":"Where in South Africa is Pinotage grown?","o":["Only in Walker Bay","Mendoza","The Central Valley","Throughout the Western Cape"],"a":3,"e":"The book says Pinotage is grown throughout the Western Cape.","x":1},
{"c":20,"q":"Which best describes a typical Pinotage?","o":["Medium tannins, high acidity and red fruit","Low tannins, low acidity and tropical fruit","High tannins, low acidity and black fruit","High tannins with pungent green pepper"],"a":0,"e":"Pinotage is related to Pinot Noir, so it shares the red fruit (strawberry, raspberry, red cherry), with medium tannins and high acidity. Oak can add coffee, chocolate and smoke.","x":1},
{"c":20,"q":"When Malbec is blended in Argentina, it's commonly blended with:","o":["Carmenère and Pinotage","Syrah and Grenache","Tempranillo and Garnacha","Cabernet Sauvignon and/or Merlot"],"a":3,"e":"Malbec is often blended with Cabernet Sauvignon and/or Merlot, though it's also frequently bottled on its own.","x":1},
{"c":20,"q":"When Carmenère is blended in Chile, it's most commonly blended with:","o":["Pinotage and Chenin Blanc","Cabernet Sauvignon and Merlot","Sangiovese and Montepulciano","Syrah and Grenache"],"a":1,"e":"Carmenère can be a single-varietal wine, but it's more commonly blended with Cabernet Sauvignon and Merlot.","x":1},
{"c":20,"q":"Carmenère is often matured in oak to soften its tannins and add flavours of:","o":["Bread and biscuit","Petrol and honey","Butter and cream","Coffee and chocolate"],"a":3,"e":"Typical Carmenère is deeply coloured, high in tannin and full-bodied, so it's often oak-matured to soften the tannins, picking up coffee and chocolate.","x":1},
{"c":13,"q":"What is the most famous region for Gewurztraminer?","o":["Rías Baixas DO in Spain","Condrieu AOC in France","Alsace AOC in France","Mosel in Germany"],"a":2,"e":"Alsace, where Gewurztraminer makes some of the region's highest-quality grand cru wines alongside Riesling and Pinot Gris.","x":1},
{"c":13,"q":"Gewurztraminer wines range in sweetness from:","o":["Always bone dry","Dry to sweet","Always sweet","Off-dry only"],"a":1,"e":"The book says Gewurztraminer makes powerfully scented wines from dry to sweet.","x":1},
{"c":13,"q":"Which two white grapes make some of the world's fullest-bodied and most floral white wines?","o":["Chardonnay and Chenin Blanc","Gewurztraminer and Viognier","Riesling and Pinot Grigio","Albariño and Sauvignon Blanc"],"a":1,"e":"Gewurztraminer (rose, lychee) and Viognier (blossom, peach, apricot) are both full-bodied and floral. Albariño, in the same chapter, is the refreshing one.","x":1},
{"c":13,"q":"Viognier is mainly grown in which climate?","o":["Cool to moderate","Hot","Cool","Moderate"],"a":3,"e":"Viognier is mainly grown in moderate climates. The trap is Gewurztraminer, which grows best in cool to moderate ones.","x":1},
{"c":13,"q":"In Condrieu AOC, Viognier is made as:","o":["A blend with Chardonnay","A blend with Syrah","A sweet botrytised wine","A single-varietal wine"],"a":3,"e":"Condrieu is dedicated to single-varietal Viognier, often with light vanilla from oak. Mixing Viognier with Syrah is a Côte-Rôtie tradition.","x":1},
{"c":13,"q":"Why is Viognier used as a blending partner?","o":["To add floral notes and body","To add bubbles","To add tannin and colour","To add very high acidity"],"a":0,"e":"Its aromatics and body make it a good partner for adding floral notes and body. In Côte-Rôtie some producers co-ferment a little with Syrah for floral aromas.","x":1},
{"c":10,"q":"What has the biggest effect on Chardonnay's primary fruit, alcohol, body and acidity?","o":["The shape of the glass","The climate the grapes are grown in","Whether it's labelled by region or grape","The type of bottle closure"],"a":1,"e":"The book says climate greatly affects all four. Cool gives green fruit and citrus, moderate gives lemon and peach, warm gives peach, pineapple and banana.","x":1},
{"c":10,"q":"A typical moderate-climate Chardonnay has:","o":["High acidity, light to medium body, green apple and wet stones","Medium acidity, full body, peach, pineapple and banana","Medium to high acidity, medium to full body, lemon, peach and sometimes melon","Low acidity, light body, lychee and rose"],"a":2,"e":"Moderate sits in the middle: medium to high acidity, medium to full body, lemon and peach with sometimes melon.","x":1},
{"c":10,"q":"Burgundy's Chardonnay areas, from north to south, are:","o":["Mâconnais, Côte d'Or, Chablis","Côte d'Or, Chablis, Mâconnais","Chablis, Mâconnais, Côte d'Or","Chablis, Côte d'Or, Mâconnais"],"a":3,"e":"Burgundy runs south from cool Chablis, through the moderate Côte d'Or, to the Mâconnais. Chablis is the most northern Chardonnay area.","x":1},
{"c":10,"q":"A white wine labelled Bourgogne AOC is typically:","o":["Simple, with apple, lemon and high acidity, from grapes grown anywhere in Burgundy","Full-bodied, oaked and age-worthy","From a single grand cru vineyard","Made only from Chablis grapes"],"a":0,"e":"Bourgogne AOC is the regional appellation, so the grapes can come from anywhere in Burgundy and the wines are usually simple.","x":1},
{"c":10,"q":"Chablis Premier Cru and Grand Cru vineyards typically face:","o":["South/south-east, on hillsides","Any direction, on the valley floor","North, on flat land","West, by the river"],"a":0,"e":"The best Chablis vineyards sit on hillsides facing south/south-east. More sun means riper grapes and more flavourful, complex wines.","x":1},
{"c":10,"q":"Why does a south/south-east-facing slope help Chardonnay in cool Chablis?","o":["It keeps the grapes cooler to protect acidity","It allows machine harvesting","It protects the vines from botrytis","More sun gives riper grapes and more flavourful wines"],"a":3,"e":"In a cool region the extra sun exposure helps the grapes ripen, which gives more flavourful and complex wines.","x":1},
{"c":10,"q":"Is oak flavour common in Chablis?","o":["Yes, new oak is required","Yes, it's usually aged in new barrels for vanilla","No, with very few exceptions it isn't detectable","Only in Grand Cru, which must be oaked"],"a":2,"e":"Producers want to keep Chablis's delicate cool-climate fruit, so they ferment in inert vessels and oak flavours are very rarely detectable.","x":1},
{"c":10,"q":"Compared with Chablis, Chardonnay from the Côte d'Or is typically:","o":["Riper, with peach and melon, from a moderate climate","Sweeter, from botrytised grapes","Lighter and always unoaked","Leaner, with green apple, from a cooler climate"],"a":0,"e":"The Côte d'Or is moderate, so the grapes reach riper peach and melon than in cool Chablis.","x":1},
{"c":10,"q":"Chardonnay production in the Côte d'Or is focused on which area?","o":["The Côte de Beaune, south of the town of Beaune","The Côte de Nuits","Chablis","The Mâconnais"],"a":0,"e":"Chardonnay in the Côte d'Or is focused on the Côte de Beaune, home of Meursault and Puligny-Montrachet. The Côte de Nuits half is the Pinot Noir side.","x":1},
{"c":10,"q":"Which winemaking options are typical for top Côte de Beaune Chardonnay?","o":["Oak fermentation and/or maturation, plus lees ageing","Inert vessels only, with no lees contact","Ageing under flor","Techniques that maximise colour and minimise tannin"],"a":0,"e":"Complexity and body come from oak barrels and ageing on the lees. The premier and grand crus can develop hazelnut and mushroom for decades.","x":1},
{"c":10,"q":"Why do California's coastal regions make more balanced Chardonnay than the Central Valley?","o":["They're hotter than inland","They're higher-yielding","Coastal influences give a longer, slower ripening season","They're irrigated more heavily"],"a":2,"e":"Coastal influences moderate the climate, so ripening is longer and slower and the grapes keep acidity while building complex flavour.","x":1},
{"c":10,"q":"Which two Northern California areas are cooled by fog or Pacific breezes, helping Chardonnay keep its acidity?","o":["Napa Valley and the Central Valley","Carneros and Sonoma","Santa Barbara and Oregon","Calistoga and Oakville"],"a":1,"e":"Carneros gets morning fogs from San Pablo Bay and the coastal vineyards of Sonoma get Pacific sea breezes. Both help grapes keep acidity.","x":1},
{"c":10,"q":"How are Santa Barbara County's Chardonnay vineyards cooled?","o":["Morning fog from San Pablo Bay","Cloud cover","High altitude","Sea breezes funnelled inland by lateral valleys"],"a":3,"e":"Santa Barbara County, on California's Central Coast, gets cooling sea breezes funnelled inland by lateral valleys.","x":1},
{"c":10,"q":"Santa Barbara County Chardonnay styles range from:","o":["Only lean, unoaked wines","Côte de Beaune-like wines to riper, tropical, new-oaked styles","Light, sweet wines to sparkling","Only high-volume wines labelled California"],"a":1,"e":"Styles vary from wines similar to the Côte de Beaune to more tropical ones with higher alcohol and pronounced new oak.","x":1},
{"c":10,"q":"Oregon Chardonnay typically has:","o":["Refreshingly high acidity, with lemon to melon flavours","Honey and dried apricot from botrytis","Low acidity and tropical fruit from a hot climate","Heavy oak and very high alcohol"],"a":0,"e":"Oregon's climate is generally moderate, so its Chardonnay often has refreshingly high acidity, with flavours from lemon to melon. That's why it tends to be fresher than warm, sunny Napa.","x":1},
{"c":10,"q":"High-volume Australian Chardonnay is typically labelled:","o":["South Eastern Australia","Margaret River","Yarra Valley","Adelaide Hills"],"a":0,"e":"South Eastern Australia covers a very broad area, and the fruit often comes from warm, irrigated inland vineyards. The other three are named quality regions.","x":1},
{"c":10,"q":"Typical Adelaide Hills and Yarra Valley Chardonnay has:","o":["Ripe stone fruit, sometimes tropical, medium to high acidity and balanced oak","Green apple, very high acidity and no oak","Low acidity and heavy oak","Lychee and rose"],"a":0,"e":"Altitude cools Adelaide Hills and ocean currents cool the Yarra, giving a longer season. The wines show ripe peach, sometimes pineapple or banana, with medium to high acidity.","x":1},
{"c":10,"q":"Which South Island region of New Zealand makes very good Chardonnay with ripe lemon, peach and melon and high natural acidity?","o":["Marlborough","Hawke's Bay","Martinborough","Central Otago"],"a":0,"e":"Marlborough, in the north-east of the South Island. Hawke's Bay is the North Island's Chardonnay region.","x":1},
{"c":10,"q":"What shapes Marlborough's cool to moderate climate for Chardonnay?","o":["A ring of mountains that blocks sea breezes","Hot, dry inland winds","Sea breezes and plentiful rainfall","High altitude"],"a":2,"e":"Marlborough has strong ocean influences, sea breezes and plentiful rain, which give Chardonnay high natural acidity and subtle oak.","x":1},
{"c":10,"q":"Chile's large, warm Central Valley makes Chardonnay that:","o":["Spans all quality levels, from high-volume brands to outstanding altitude-moderated wines","Is always lean and cool-climate in style","Is never oaked","Is only sparkling"],"a":0,"e":"The Central Valley makes everything from inexpensive high-volume brands to outstanding wines from vineyards moderated by altitude. Casablanca is Chile's cool, coastal Chardonnay region.","x":1},
{"c":10,"q":"High-volume South African Chardonnay mostly comes from where, and is sometimes blended with what?","o":["Walker Bay, with Sauvignon Blanc","The hot inland Western Cape, sometimes with Chenin Blanc","Elgin, with Semillon","Stellenbosch, with Pinotage"],"a":1,"e":"The hot inland vineyards of the Western Cape are mostly for high-volume brands, where Chardonnay is sometimes blended with other whites such as Chenin Blanc.","x":1},
{"c":10,"q":"Why is Walker Bay among the coolest regions in South Africa?","o":["Cloud cover","High altitude","Morning fog from a river","Strong sea breezes from the south"],"a":3,"e":"Coastal Walker Bay is exposed to strong sea breezes from the south, which is why it makes very good Chardonnay with high acidity.","x":1},
{"c":10,"q":"How has Chardonnay changed since the heavily oaked wines of the 1980s and 1990s?","o":["Oak is now banned for Chardonnay","Producers are much more careful not to overpower the fruit with oak","It's now always heavily oaked","It's now mostly made sweet"],"a":1,"e":"Chardonnay suffered from its heavy-oak reputation, so producers now take more care. It's still more likely to show oak than Pinot Grigio or Sauvignon Blanc.","x":1},
{"c":10,"q":"At the premium end, why is Chardonnay so highly regarded?","o":["It never needs any winemaking choices","It's the cheapest grape to grow","It can express its climate or vineyard as well as the winemaker's skill","It always tastes the same wherever it's grown"],"a":2,"e":"Chardonnay shows both where it was grown and what the winemaker did, through choices like malo, lees and oak. That's why people call it a winemaker's grape.","x":1},
{"c":9,"q":"Chenin Blanc grows well in which climates?","o":["Cool only","Warm only","Cool, moderate and warm","Moderate only"],"a":2,"e":"Chenin is very versatile: it grows well in all three, and its flavours shift from apple and lemon to peach, pineapple and mango as it ripens.","x":1},
{"c":9,"q":"A typical inexpensive South African Chenin Blanc is:","o":["Sweet and botrytised","Pale and light, with green apple and never any oak","Made only from old vines","Dry and medium-bodied, with peach and pineapple, sometimes vanilla from oak chips"],"a":3,"e":"High-volume Chenin uses grapes from warmer inland areas, is often blended (e.g. with Chardonnay), and can get vanilla from oak chips or staves. Old vines give the pronounced tropical, oak-matured top wines.","x":1},
{"c":9,"q":"Compared with a dry Vouvray, a sweet Vouvray typically shows:","o":["Vanilla and toast from new oak","Stone-fruit or tropical-fruit aromas, from extra-ripe or botrytised grapes","Black fruit","Fresh green apple"],"a":1,"e":"Dry Vouvray often has fresh apple. Sweeter styles come from extra-ripe or botrytised grapes and show stone or tropical fruit.","x":1},
{"c":9,"q":"What can the best Vouvrays develop with age in bottle?","o":["Butter and cream","Honey and dried fruit","Leather and tobacco","Fresh grass"],"a":1,"e":"Chenin's high acidity lets the best wines age for many years, and the best Vouvrays of all styles develop honey and dried fruit. So yes, top Vouvray is age-worthy.","x":1},
{"c":9,"q":"Furmint is grown most widely in which country?","o":["France","South Africa","Hungary","Italy"],"a":2,"e":"Furmint is grown most widely in Hungary and is the most planted grape of Tokaj.","x":1},
{"c":9,"q":"Where in Hungary is the Tokaj region?","o":["The south-west","The north-east","The far west","The south-east"],"a":1,"e":"Tokaj is in north-east Hungary, and Furmint is its most planted grape.","x":1},
{"c":9,"q":"Besides Tokaji Aszú, what else does Tokaj produce?","o":["Nothing else, only Tokaji Aszú","Dry and medium wines","Mainly sparkling wines","Mainly fortified wines"],"a":1,"e":"Tokaj also makes dry and medium wines, though it's most famous for sweet Tokaji Aszú. So Aszú isn't the only Furmint style.","x":1},
{"c":9,"q":"On the palate, Tokaji Aszú is:","o":["Sweet, light-bodied and low in acidity","Sweet and full-bodied, balanced by high acidity, with a long finish","Dry, light and crisp","Off-dry and sparkling"],"a":1,"e":"Aszú is sweet and full-bodied with balancing high acidity and a long, intense finish. On the nose it combines apricot, citrus, vanilla, smoke and caramel, and it keeps developing for years.","x":1},
{"c":17,"q":"A typical wine labelled Beaujolais AOC is:","o":["Light and simple, mostly from high-yielding vines in the flat, fertile south","From one of ten named villages","Medium-sweet","Full-bodied and built to age"],"a":0,"e":"Beaujolais AOC can come from anywhere in the region, but mostly from high-yielding southern vineyards, which give the lightest, simplest wines.","x":1},
{"c":17,"q":"Wines from the Beaujolais crus are typically:","o":["The lightest and simplest","The region's most concentrated and structured, some able to age","Blends of Gamay and Pinot Noir","Sparkling"],"a":1,"e":"The crus are the most concentrated and structured wines of Beaujolais. Most are still for early drinking, but some can develop in bottle.","x":1},
{"c":17,"q":"Why is Beaujolais sometimes served lightly chilled?","o":["To soften its very high tannins","Because it's sweet","To hide faults","To highlight its refreshing acidity and keep its delicate fruit"],"a":3,"e":"A light chill shows off Gamay's refreshing acidity and keeps its delicate red fruit. Most Beaujolais is meant to be drunk young.","x":1},
{"c":18,"q":"Where is Grenache thought to have evolved?","o":["The Southern Rhône","Italy","Australia","Spain, where it's called Garnacha"],"a":3,"e":"Grenache is thought to have evolved in Spain as Garnacha, then spread through the south of France into the Rhône, where it took the name Grenache.","x":1},
{"c":18,"q":"Which rosé method is commonly used for Grenache?","o":["Appassimento","Ageing under flor","Blending red and white wine","Short maceration"],"a":3,"e":"Thanks to its red fruit, Grenache is commonly made into rosé by short maceration, dry to medium, to drink chilled and young.","x":1},
{"c":18,"q":"What flavours can Grenache develop with time in bottle?","o":["Earth, meat and dried fruit","Petrol and honey","Fresh green apple","Butter and cream"],"a":0,"e":"With bottle age Grenache develops earth, meat and dried fruit. Top Châteauneuf-du-Pape can show dried fruit and caramel.","x":1},
{"c":18,"q":"Why is the Southern Rhône warm enough for Grenache?","o":["The valley flattens out and it lies further south","It gets morning fog","Its vineyards are steep, sun-facing slopes","It's high in the mountains"],"a":0,"e":"In the south the valley flattens out and the southerly latitude makes the climate warm, so Grenache can ripen.","x":1},
{"c":18,"q":"Southern Rhône red wines are typically:","o":["100% Grenache","Blends of Grenache with several local grapes, including Syrah","100% Syrah","Blends of Cabernet and Merlot"],"a":1,"e":"Grenache is important in the Southern Rhône but it's blended with several local grapes, Syrah among them. The Northern Rhône is where Syrah stands alone.","x":1},
{"c":18,"q":"A typical Châteauneuf-du-Pape red is:","o":["Full-bodied and high in alcohol, ageing into dried fruit and caramel","Sweet","A pale, dry rosé","Light and fruity, for early drinking"],"a":0,"e":"Châteauneuf-du-Pape is known for full-bodied, high-alcohol wines, helped by heat-storing stones. The best develop dried fruit and caramel with age.","x":1},
{"c":18,"q":"Which South of France appellation is one of the most important for Grenache?","o":["Sancerre AOC","Minervois AOC","Pomerol AOC","Condrieu AOC"],"a":1,"e":"Minervois. Grenache ripens well in the warm south and adds red fruit and body to blends with local grapes like Syrah.","x":1},
{"c":18,"q":"In Barossa Valley and McLaren Vale, Grenache is blended with:","o":["Shiraz and other varieties","Pinot Noir","Merlot","Tempranillo"],"a":0,"e":"These South Australian regions have many very old Grenache vines, and Grenache is blended with Shiraz and others in a style that can resemble Châteauneuf-du-Pape.","x":1},
{"c":21,"q":"Gavi DOCG comes from which Italian region?","o":["The Veneto","Piemonte, in north-west Italy","The Marche","Campania"],"a":1,"e":"Gavi, made from Cortese, is in Piemonte in north-west Italy.","x":1},
{"c":21,"q":"Which best describes Garganega?","o":["Dry, medium-bodied, high acidity, with apple, pear, lemon and peach","Dry, light-bodied, with blossom, apple and lemon","Medium acidity, full body, with peach, melon and mango","High acidity, medium body, with a fennel note"],"a":0,"e":"Garganega gives dry, medium-bodied, high-acid wines with green, citrus and stone fruit. The fennel is the giveaway for Verdicchio.","x":1},
{"c":21,"q":"Soave DOC and Soave Classico DOC come from which region?","o":["Piemonte","Tuscany","The Marche","The Veneto, in north-east Italy"],"a":3,"e":"Garganega is widely planted in the Veneto and is the main grape of Soave.","x":1},
{"c":21,"q":"How is Soave DOC typically made?","o":["From dried grapes","Matured in new oak for long ageing","As a sparkling wine","Fermented in inert vessels and not oaked, for drinking young"],"a":3,"e":"Soave is made in inert vessels without oak, and most should be drunk young. The best Soave Classico can gain honey and almonds.","x":1},
{"c":21,"q":"What is the most famous wine made from Verdicchio?","o":["Fiano di Avellino DOCG","Gavi DOCG","Verdicchio dei Castelli di Jesi DOC","Soave Classico DOC"],"a":2,"e":"Verdicchio dei Castelli di Jesi DOC, from the Marche on Italy's east coast.","x":1},
{"c":4,"q":"Climate is made up of a combination of:","o":["Soil, slope and grape variety","Hail, frost and drought","Heat, sunlight and water availability","Yield, pruning and harvest date"],"a":2,"e":"The book defines climate as heat, sunlight and water availability together.","x":1},
{"c":4,"q":"What's the difference between climate and weather?","o":["Weather is the long-term average; climate is day to day","Climate is only about rainfall","They mean the same thing","Climate is what a region typically expects; weather is what actually happens day to day"],"a":3,"e":"Climate is the average temperature, sunlight and rainfall a region can expect. Weather is what actually happens day to day, and its extremes cause the grower problems.","x":1},
{"c":4,"q":"Why is temperature so important for a wine region?","o":["It decides which closure is used","It decides the alcohol limit on the label","It decides which grapes can grow there and what flavours they develop","It only matters for sparkling wine"],"a":2,"e":"Temperature determines which grape varieties can succeed and the flavours they develop. Grenache needs a warm climate, while Chardonnay grows in many climates but tastes different in each.","x":1},
{"c":4,"q":"What is the most important factor influencing a wine region's climate?","o":["Latitude","Rivers","Aspect","Soil"],"a":0,"e":"Latitude: the closer to the equator, the hotter. That's why most vineyards sit between 30° and 50°.","x":1},
{"c":4,"q":"How does altitude affect a vineyard's temperature?","o":["Higher vineyards are warmer","It only affects rainfall","Higher vineyards are cooler than lower ones at the same latitude","Altitude makes no difference"],"a":2,"e":"Temperatures drop with altitude, so a higher vineyard is always cooler than a lower one at the same latitude. Adelaide Hills and Mendoza use this.","x":1},
{"c":4,"q":"How do rivers help vineyards in cooler regions?","o":["They make the vineyard colder at night","They block sunlight","They cause hail","They hold warmth into autumn, extending the season, and reflect sunlight"],"a":3,"e":"Rivers warm up and cool down more slowly than land, so in autumn they're warmer, extending the season. They also reflect sunlight and help protect against frost.","x":1},
{"c":4,"q":"How can cold air from mountains help a warm vineyard?","o":["It causes botrytis","It flows down at night and cools vineyards that heated up during the day","It brings rain that swells the grapes","It warms the vineyard in the morning"],"a":1,"e":"Cool air from mountains moves down to lower altitudes at night, cooling vineyards where heat built up during the day.","x":1},
{"c":4,"q":"How do mountains act as a barrier for vineyards?","o":["They trap fog over the vineyards","They block all sunlight","They make the growing season shorter","They shelter vineyards from clouds, rain and cold winds"],"a":3,"e":"Mountains shelter vineyards from clouds, rain and cold winds, giving sunny summers, dry autumns and a longer season. The Vosges in Alsace and the ring of mountains in Central Otago are examples.","x":1},
{"c":4,"q":"Why are autumn morning mists near rivers important?","o":["They protect against hail","They stop the grapes ripening","They're essential for botrytis/noble rot to develop","They raise sugar by warming the grapes"],"a":2,"e":"Botrytis needs damp, misty mornings followed by warm, dry afternoons, and the mists that form near rivers in autumn provide them.","x":1},
{"c":4,"q":"What damage can hail do?","o":["Damage vines and grapes; a heavy storm can destroy a whole year's crop","Concentrate the sugars for sweet wine","Only affect the leaves, never the grapes","Spread fungal disease"],"a":0,"e":"Hail can badly damage vines and grapes, and heavy storms can wipe out the entire annual crop. Growers in Argentina use netting to protect vines.","x":1},
{"c":4,"q":"In the worst cases of drought, what can happen?","o":["Botrytis spreads","The vine can't ripen its grapes and may die","Acidity rises too high","The grapes swell and dilute"],"a":1,"e":"Drought comes from long periods of low rain, often made worse by heat. The vine can't ripen its grapes and in the worst cases may die. Irrigation helps if there's water.","x":1},
{"c":4,"q":"What is a Geographical Indication (GI)?","o":["The producer's brand name","A legally defined vineyard area within a country","A quality score","The name of the grape variety"],"a":1,"e":"A GI is a legally defined vineyard area within a country, and it can be very large or tiny. GIs matter because where grapes grow affects the style of wine.","x":1},
{"c":4,"q":"Which are France's PDO labelling terms?","o":["DOC and DOCG","DO and DOCa","AOP and AOC","IGP and Vin de pays"],"a":2,"e":"France: PDO = AOP and AOC. PGI = IGP and Vin de pays.","x":1},
{"c":4,"q":"Which are Italy's PDO labelling terms?","o":["DOC and DOCG","IGT","AOP and AOC","Qualitätswein and Prädikatswein"],"a":0,"e":"Italy: PDO = DOC and DOCG. PGI = IGT.","x":1},
{"c":4,"q":"Which are Germany's PDO labelling terms?","o":["Landwein","DO and DOCa","Qualitätswein and Prädikatswein","Vin de pays"],"a":2,"e":"Germany: PDO = Qualitätswein and Prädikatswein. PGI = Landwein.","x":1},
{"c":14,"q":"Merlot grows in which climates?","o":["Moderate and warm","Cool only","Cool to moderate","Hot only"],"a":0,"e":"Merlot grows in moderate and warm climates. Riper styles come easily in warm climates, or by picking later in moderate ones.","x":1},
{"c":14,"q":"Where is the classic home of Merlot?","o":["Tuscany","Chile","Bordeaux, in south-west France","Burgundy"],"a":2,"e":"Bordeaux is Merlot's homeland and its classic home, and it's the most widely planted grape there.","x":1},
{"c":14,"q":"Is Merlot usually oaked?","o":["Both: light styles need little oak, fuller styles may benefit from it","Only with oak chips","Always, in new oak","Never"],"a":0,"e":"Both oaked and unoaked Merlot are made. A light style doesn't need long barrel ageing, while a fuller one can gain softness and complexity from oak.","x":1},
{"c":14,"q":"Bordeaux's Left and Right Banks are divided by:","o":["The Douro","The Loire","The Rhône","The Gironde Estuary, where the Garonne and Dordogne meet"],"a":3,"e":"The Gironde Estuary, where the Garonne and Dordogne Rivers meet. Médoc, Graves and Sauternes are west and south (Left Bank); Saint-Émilion and Pomerol are north and east (Right Bank).","x":1},
{"c":14,"q":"Red wines labelled Bordeaux AOC or Bordeaux Supérieur AOC are typically:","o":["Single-vineyard wines","Cabernet-dominated blends from the Left Bank only","Merlot-dominated blends from anywhere in Bordeaux","Sweet"],"a":2,"e":"These two regional appellations can use grapes from across Bordeaux and are typically Merlot-dominated, which makes sense since Merlot is the most widely planted grape.","x":1},
{"c":14,"q":"In Left Bank Bordeaux blends, which grape is typically dominant?","o":["Merlot","Syrah","Cabernet Sauvignon, with Merlot usually in the blend","Malbec"],"a":2,"e":"Merlot is usually part of Left Bank blends, but Cabernet Sauvignon leads. On the Right Bank, Merlot leads.","x":1},
{"c":14,"q":"Saint-Émilion AOC includes which more prestigious appellation?","o":["Pomerol AOC","Saint-Émilion Grand Cru AOC","Pessac-Léognan AOC","Haut-Médoc AOC"],"a":1,"e":"Pomerol and Saint-Émilion are the key Right Bank appellations, and Saint-Émilion includes the more prestigious Saint-Émilion Grand Cru AOC.","x":1},
{"c":14,"q":"In the South of France, Merlot is found on its own and blended with:","o":["Pinot Noir and Gamay","Tempranillo","Cabernet Sauvignon, Grenache and Syrah","Sangiovese"],"a":2,"e":"Merlot is planted widely in the warm south, as a single-varietal wine at all levels and in blends with Cabernet Sauvignon, Grenache and Syrah.","x":1},
{"c":14,"q":"In California, where does concentrated, full-bodied Merlot come from?","o":["Carneros only","Napa Valley and Sonoma","Oregon","Wines labelled 'California'"],"a":1,"e":"Californian Merlot ranges from fruity, medium-bodied wines labelled California to concentrated, full-bodied ones from neighbouring Napa Valley and Sonoma.","x":1},
{"c":14,"q":"How common are oak flavours in Californian Merlot?","o":["Rare, because oak is avoided","Only in rosé","Common: often pronounced vanilla, coconut and smoke","Never from chips"],"a":2,"e":"Pronounced oak (vanilla, coconut, smoke) is common in Californian reds. The best are often aged in new barrels, while high-volume producers may use chips or staves.","x":1},
{"c":14,"q":"Which South African region is known for complex, age-worthy blends of Bordeaux varieties?","o":["Elgin","Stellenbosch","Walker Bay","Mendoza"],"a":1,"e":"Stellenbosch has a strong reputation for complex, age-worthy reds from classic Bordeaux grapes. Its mountainous climate runs moderate to warm, depending on altitude and sea breezes.","x":1},
{"c":14,"q":"What is Hawke's Bay's climate like for Merlot?","o":["Cool, ringed by mountains","Moderate, with plentiful rainfall","Hot and dry","Cool, with strong sea breezes"],"a":1,"e":"Hawke's Bay, where most New Zealand Merlot grows, is moderate with plentiful rain. Styles run from light and fruity to full-bodied and long-lived.","x":1},
{"c":22,"q":"Northern Italy's vineyards lie in the foothills of the Alps and on the flat plain of which river?","o":["The Po","The Rhône","The Gironde","The Douro"],"a":0,"e":"The book places northern Italy's vineyards in the Alpine foothills and on the large, flat Po plain. Many top sites are protected by the mountains to the north.","x":1},
{"c":22,"q":"What protects many of northern Italy's finest vineyards?","o":["The Vosges","The Apennines","The Andes","The Alps, the mountains to the north"],"a":3,"e":"Many of northern Italy's best sites benefit from the mountains to the north, the Alps, which also give a broad range of slopes and soils. The climate there is generally moderate.","x":1},
{"c":22,"q":"Why is Nebbiolo often matured for long periods in oak?","o":["To deepen its colour","To add acidity","To soften its high tannins","To add sweetness"],"a":2,"e":"Nebbiolo has high tannins, so it's often matured for a long time in oak to soften them. Some producers use old oak; others use new oak for its aromas.","x":1},
{"c":22,"q":"Corvina wines typically have:","o":["Deep colour and black fruit","Low acidity and tropical fruit","Low to medium tannins, high acidity, red cherry and red plum","High tannins and high acidity"],"a":2,"e":"Corvina is low to medium in tannin with high acidity and red fruit, similar to Barbera. Nebbiolo is the one with high tannin.","x":1},
{"c":22,"q":"Valpolicella, where Corvina is the most important grape, is in which region?","o":["Piemonte","Campania","The Veneto, in north-east Italy","Tuscany"],"a":2,"e":"Corvina is the key grape of Valpolicella in the Veneto, usually dominating the blend with other local grapes.","x":1},
{"c":22,"q":"Which three wines are made using the appassimento method?","o":["Gavi, Soave and Recioto di Soave","Barolo, Barbaresco and Amarone","Valpolicella Classico, Amarone and Soave","Amarone della Valpolicella, Recioto della Valpolicella and Recioto di Soave"],"a":3,"e":"Appassimento is widely used in the Veneto: Amarone (dry), Recioto della Valpolicella (sweet red) and Recioto di Soave (sweet white). Plain Valpolicella and Classico use fresh grapes.","x":1},
{"c":12,"q":"Pinot Grigio/Pinot Gris grows mainly in which climates?","o":["Warm","Cool or moderate","Warm to hot","Hot"],"a":1,"e":"It grows primarily in cool or moderate climates. Its two styles come mainly from yield and harvest timing.","x":1},
{"c":12,"q":"Which appellation covers the whole of Alsace?","o":["Vendanges Tardives","Vin de pays","Alsace Grand Cru AOC","Alsace AOC"],"a":3,"e":"Alsace AOC is the regional appellation for the entire area, and its wines are usually labelled with the grape variety.","x":1},
{"c":12,"q":"Which Alsace appellation covers specific vineyards, mostly on the Vosges foothills?","o":["Crémant","Alsace AOC","Vendanges Tardives","Alsace Grand Cru AOC"],"a":3,"e":"Alsace Grand Cru AOC covers specific vineyards, mostly on steep east/south-east-facing Vosges foothills, which get more sun and give riper, fuller wines.","x":1},
{"c":12,"q":"As a labelling term, Vendanges Tardives can only be used in:","o":["Alsace","The Loire","Burgundy","Sauternes"],"a":0,"e":"It means 'late harvest' in French, but the term can only be used in Alsace. It usually means a medium to sweet wine from extra-ripe grapes.","x":1},
{"c":12,"q":"Vendanges Tardives can appear on which Alsace wines?","o":["Only Alsace Grand Cru AOC","Only Crémant","Both Alsace AOC and Alsace Grand Cru AOC","Only Alsace AOC"],"a":2,"e":"Both Alsace and Alsace Grand Cru wines can be labelled VT, from Pinot Gris, Riesling or Gewurztraminer.","x":1},
{"c":12,"q":"Light Pinot Grigio is best drunk:","o":["After decanting","Only with dessert","After five years in bottle","Young and fresh, as its simple flavours fade quickly"],"a":3,"e":"The light style's simple flavours fade quickly in bottle. The concentrated, full-bodied style can develop ginger and honey.","x":1},
{"c":6,"q":"Pinot Noir is most commonly made as:","o":["A single-varietal wine, with sparkling wine like Champagne the notable exception","A blend with Cabernet Sauvignon","A blend with Syrah","Mostly rosé"],"a":0,"e":"Pinot Noir is usually bottled on its own. Sparkling wines such as Champagne are the notable exception, where it's blended.","x":1},
{"c":6,"q":"In Burgundy, the best Pinot Noir sites face which way?","o":["South and south-east, for extra sunlight","They're on flat valley floors","West, for late sun","North, to stay cool"],"a":0,"e":"The best sites are on south- and south-east-facing slopes that get extra sunlight, giving concentrated, complex wines that can age.","x":1},
{"c":6,"q":"Burgundy's most celebrated vineyards are found in which part of the region?","o":["The Côte d'Or","Chablis","Beaujolais","The Mâconnais"],"a":0,"e":"The Côte d'Or, split into the Côte de Nuits in the north and the Côte de Beaune in the south.","x":1},
{"c":6,"q":"Compared with Bourgogne AOC, Burgundy village wines typically offer:","o":["More flavour intensity, complexity and length","Lighter body and simpler fruit","Sweetness","Lower prices"],"a":0,"e":"Village vineyards are usually better situated, sometimes on well-drained slopes with good aspect, so the wines have more intensity, complexity and length than Bourgogne AOC.","x":1},
{"c":6,"q":"Compared with village wines, premier cru and grand cru Burgundies are:","o":["Lighter and meant to drink young","The most complex and intense, from slopes with extra sun and warmth","Made from bought-in grapes from anywhere","Usually sweet"],"a":1,"e":"They come from prestigious vineyards on south- or south-east-facing slopes, giving concentrated fruit, subtle oak and forest floor and mushroom with age. Grands crus are the very best.","x":1},
{"c":6,"q":"Which two subtle oak aromas do the best Pinot Noirs often show?","o":["Butter and cream","Smoke and cloves","Vanilla and coconut","Bread and biscuit"],"a":1,"e":"The best Pinot Noirs often show subtle smoke and cloves balanced by fruit, which is why older or larger barrels are popular.","x":1},
{"c":6,"q":"Where in California does Pinot Noir do best?","o":["A small number of regions close to the coast, cooled by fog and breezes","Anywhere in the state","The far north of Napa, around Calistoga","The hot inland Central Valley"],"a":0,"e":"Much of California is too warm for Pinot Noir, so it's made in a few coastal regions where fog and breezes cool the vineyards.","x":1},
{"c":6,"q":"Compared with Burgundy, Californian Pinot Noir tends to show:","o":["Sweetness","Ripe red fruit and often notable vanilla from oak","Black fruit and high tannin","Very pale colour and no oak at all"],"a":1,"e":"California's Pinot tends to have ripe strawberry and red cherry, often with noticeable vanilla from oak. Burgundy's best show subtler oak like cloves and smoke.","x":1},
{"c":6,"q":"Western Sonoma's Pinot Noir vineyards are cooled by:","o":["Morning fog from San Pablo Bay","Pacific Ocean breezes","Altitude","Breezes from the Southern Ocean"],"a":1,"e":"The western parts of Sonoma are cooled by Pacific breezes. Carneros, next door, gets fog from San Pablo Bay.","x":1},
{"c":6,"q":"What cools Santa Barbara County's Pinot Noir vineyards?","o":["Altitude","Sea breezes from the west and south","Morning fog from San Pablo Bay","A ring of mountains"],"a":1,"e":"Santa Barbara County on the Central Coast is cooled by sea breezes from the west and south, which stops Pinot developing overly cooked flavours.","x":1},
{"c":6,"q":"Which three New Zealand regions are known for very good to outstanding Pinot Noir?","o":["Hawke's Bay, Marlborough and Central Otago","Martinborough, Marlborough and Central Otago","Yarra Valley, Mornington Peninsula and Marlborough","Hawke's Bay, Gisborne and Martinborough"],"a":1,"e":"Martinborough and Marlborough are cool to moderate Pinot regions, and Central Otago makes the country's ripest, most powerful Pinot.","x":1},
{"c":25,"q":"Port is made from:","o":["A blend of local black grapes, usually from several vintages","White Pedro Ximénez","Palomino","A single grape variety from a single year"],"a":0,"e":"Port blends local black grapes, and most Ports blend wines from several vintages. Vintage Port and LBV are the single-year exceptions.","x":1},
{"c":25,"q":"What largely determines the different styles of Port?","o":["Dosage","How it's matured","Botrytis","The grape variety"],"a":1,"e":"All Port follows the same basic winemaking, and the maturation decides the style: large vessels keep Ruby styles fruity; long oxidative ageing in small barrels makes Tawny.","x":1},
{"c":25,"q":"Which Port style is the simplest, fruitiest and lowest in tannin of the ruby styles?","o":["Reserve Ruby Port","Vintage Port","Late Bottled Vintage Port","Inexpensive Ruby Port"],"a":3,"e":"Inexpensive Ruby Ports are sweet, simple and fruity, with lower tannins than other ruby styles.","x":1},
{"c":25,"q":"How does Reserve Ruby Port differ from Ruby Port?","o":["It's aged in small barrels until tawny","It's made from white grapes","Better wines with more flavour intensity, sometimes aged longer","It comes from a single vintage"],"a":2,"e":"Reserve Ruby uses better-quality wines with more intensity and is sometimes matured longer to soften the added alcohol. LBV is that style from one vintage.","x":1},
{"c":25,"q":"How does Vintage Port differ from Late Bottled Vintage (LBV)?","o":["It's aged in small barrels until tawny","It blends several vintages","It's lighter and made every year","Only the best wines of a single exceptional year; high tannin, ages 20+ years, needs decanting"],"a":3,"e":"Both are single-vintage, but LBV is a Reserve Ruby style. Vintage Port uses only the highest-quality wines from exceptional years, is high in tannin, ages for 20+ years and throws a thick sediment.","x":1},
{"c":25,"q":"A fine aged Tawny Port typically shows:","o":["Dried fruit, walnut, coffee and caramel","Fig and prune, almost black in colour","Biscuit and bread dough","Fresh black cherry and pepper"],"a":0,"e":"Long oxidative ageing in small barrels turns the colour tawny and gives dried fruit plus walnut, coffee and caramel. These often carry a 10, 20, 30 or 40 year age indication.","x":1},
{"c":25,"q":"Sherry is produced around which town?","o":["Tokaj, in Hungary","Jerez de la Frontera, in southern Spain","Porto, in Portugal","Rioja, in northern Spain"],"a":1,"e":"Sherry comes from around Jerez de la Frontera in southern Spain, almost always starting from a dry Palomino base wine.","x":1},
{"c":25,"q":"What is a solera?","o":["A system of old-oak casks holding wines of different ages, blended as they age","A layer of yeast on the wine","A stainless steel tank","A method of drying grapes in the sun"],"a":0,"e":"A solera is a system of old-oak casks with wines of different ages, continually blended for a consistent, complex style. It's where Sherry develops its flavours, after fortification.","x":1},
{"c":25,"q":"What are the three most important styles of dry Sherry?","o":["Ruby, Tawny and LBV","Fino, PX and Cream","Pale Cream, Medium and Cream","Fino, Oloroso and Amontillado"],"a":3,"e":"Fino, Oloroso and Amontillado are the key dry styles. They differ mainly through different ageing periods and conditions in the solera.","x":1},
{"c":25,"q":"What mainly makes Fino, Oloroso and Amontillado different from each other?","o":["Different sweetness levels","Different ageing periods and conditions in the solera","Different regions","Different grape varieties"],"a":1,"e":"They all start as dry Palomino wine. What changes is how long and how they age: under flor, oxidatively, or one then the other.","x":1},
{"c":25,"q":"Ageing Sherry under a layer of flor is called:","o":["Appassimento","Oxidative ageing","Autolysis","Biological ageing"],"a":3,"e":"Ageing under flor is biological ageing. The flor protects the wine from oxygen. Oloroso, with no flor, ages oxidatively.","x":1},
{"c":25,"q":"A typical Fino Sherry is:","o":["Brown, with raisins, walnuts and caramel","Pale lemon, with apple, almonds and bready flor notes","Deeper in colour, with both flor and walnut notes","Almost black and very sweet"],"a":1,"e":"Fino is pale lemon with apple, almonds and biscuit or bread-dough notes from flor. Drink it chilled and soon after bottling.","x":1},
{"c":25,"q":"Why doesn't flor grow on Oloroso?","o":["It's sweetened before ageing","It's made from Pedro Ximénez grapes","It's aged in stainless steel","It's fortified to about 17%, too strong for flor to survive"],"a":3,"e":"Oloroso is fortified to around 17%, a strength flor can't survive, so it ages in contact with oxygen and turns brown, with dried fruit, walnut and caramel. Fino is fortified to only about 15%.","x":1},
{"c":25,"q":"Besides being its own style, what is Pedro Ximénez often used for?","o":["Making Fino","Starting the flor","Sweetening Cream Sherries","Fortifying Port"],"a":2,"e":"PX, made from sun-dried Pedro Ximénez grapes, is very sweet and almost black. It's often the sweetening component in Cream Sherries.","x":1},
{"c":7,"q":"What alcohol levels would you expect from White Zinfandel and red Zinfandel?","o":["Both medium","White Zinfandel high, red Zinfandel low","White Zinfandel low, red Zinfandel high","Both high"],"a":2,"e":"The rosé is stopped part way through fermentation by removing the yeasts, so it ends up around 8–10% abv with some sweetness left. The red ferments right through, giving high alcohol.","x":1},
{"c":7,"q":"Is California's red Zinfandel commonly matured in oak?","o":["No, it's kept in stainless steel to stay fruity","Yes, to soften the tannins and add complexity","No, oak would hide its dried-fruit flavours","Only White Zinfandel is oak-aged"],"a":1,"e":"The reds are commonly matured in oak. It softens the tannins and adds flavours like vanilla and coffee alongside the black and dried fruit.","x":1},
{"c":7,"q":"Which is drier: White Zinfandel or red Zinfandel?","o":["White Zinfandel","They're both dry","Red Zinfandel","They're both medium-sweet"],"a":2,"e":"White Zinfandel is a medium-sweet rosé. The red goes through a complete fermentation and is dry, with high alcohol and a full body.","x":1},
{"c":7,"q":"What can wines from California's very old Zinfandel vines develop in the bottle?","o":["Petrol and honey","Bread and biscuit","Banana and candy","Earth and meat"],"a":3,"e":"Old vines give small amounts of very concentrated fruit, and the wines can develop tertiary flavours of earth and meat with time in bottle.","x":1},
{"c":8,"q":"What kind of climate does Riesling prefer?","o":["Warm to hot","Moderate to hot","Hot only","Cool to moderate"],"a":3,"e":"Riesling is cold-hardy and prefers cool to moderate climates, where its sugars and flavours can build slowly.","x":1},
{"c":8,"q":"Which is true of Riesling?","o":["It's naturally low in acidity and susceptible to botrytis","It's naturally low in acidity and resists botrytis","It's naturally high in acidity and susceptible to botrytis","It's naturally high in acidity but resists botrytis"],"a":2,"e":"High natural acidity plus a weakness for botrytis is what lets Riesling make outstanding wines at every sweetness level.","x":1},
{"c":8,"q":"What's the biggest benefit of Riesling's high acidity when it comes to ageing?","o":["It raises the alcohol as the wine ages","It stops tertiary flavours from forming","It keeps the wine fresh while tertiary flavours develop","It adds tannin for structure"],"a":2,"e":"The finest Rieslings can age for decades. High acidity preserves their freshness while they develop honey and petrol.","x":1},
{"c":8,"q":"What tertiary flavours can aged Riesling develop?","o":["Leather and meat","Honey and petrol","Vanilla and coffee","Butter and cream"],"a":1,"e":"Aged Riesling is known for honey and petrol (gasoline). Alsace grands crus can also show honey and dried fruit.","x":1},
{"c":8,"q":"Off-dry or medium Rieslings can get their sweetness in which two ways?","o":["Removing the yeast to stop fermentation, or adding Süssreserve","Freezing the grapes, or fortifying with spirit","Adding sugar after fermentation, or ageing in oak","Using botrytis, or blending with Chardonnay"],"a":0,"e":"Producers either stop the fermentation by removing the yeast, which leaves lower alcohol and some sugar, or add sterile grape juice called Süssreserve.","x":1},
{"c":8,"q":"How do the sweetest styles of Riesling keep their sugar?","o":["The winemaker adds Süssreserve","The wine is filtered to remove the yeast","The juice is so high in sugar that fermentation stops naturally","Spirit is added to kill the yeast"],"a":2,"e":"The sweetest styles start with extra-ripe grapes. The juice is so sugary that the yeast can't finish, so fermentation stops on its own.","x":1},
{"c":8,"q":"Which region has the lightest-bodied Rieslings, and why?","o":["Alsace, because of the Vosges Mountains","The Pfalz, because of its dry, sunny climate","The Rheingau, because its vineyards face south","The Mosel, because of its northerly latitude"],"a":3,"e":"Mosel's northerly latitude makes its Rieslings lighter in body than those from further south.","x":1},
{"c":8,"q":"What helps Riesling grapes ripen in the Mosel?","o":["Steep slopes, stony soils and sunlight reflected off the river","Warm sea breezes","Protection from mountains to the west","High altitude"],"a":0,"e":"The best Mosel vineyards are on steep south- or south-east-facing slopes along the river, where stony soils and reflected sunlight help the grapes ripen.","x":1},
{"c":8,"q":"The Rheingau's vineyards are on which bank of the Rhine?","o":["The south bank, on north-facing slopes","The north bank, on south-facing slopes","The east bank, facing the morning sun","Both banks equally"],"a":1,"e":"They're on steep, south-facing slopes on the north bank, which points them towards the sun.","x":1},
{"c":8,"q":"The Pfalz can be thought of as an extension of which region?","o":["Alsace in France","The Mosel","Burgundy","The Rheingau"],"a":0,"e":"The Pfalz is near the French border, sheltered by mountains to the west, with a dry, sunny climate and a long growing season. Climatically it's like Alsace, and the wines are similar.","x":1},
{"c":8,"q":"Alsace is one of the ____ and ____ regions in France.","o":["Driest and sunniest","Wettest and coolest","Cloudiest and windiest","Hottest and most humid"],"a":0,"e":"The Vosges Mountains block rain-bearing westerly winds, making Alsace one of the driest and sunniest regions in France.","x":1},
{"c":8,"q":"Which way do the best Alsace vineyards face?","o":["South-west, towards the Vosges","North, to keep the grapes cool","West, for the afternoon sun","East or south-east, for the morning sun"],"a":3,"e":"They're planted on the mountain foothills facing east or south-east to catch the morning sun.","x":1},
{"c":8,"q":"Which three Prädikat categories can be made in a dry style?","o":["Beerenauslese, Trockenbeerenauslese and Eiswein","Kabinett, Auslese and Eiswein","Spätlese, Beerenauslese and TBA","Kabinett, Spätlese and Auslese"],"a":3,"e":"Kabinett, Spätlese and Auslese come from grapes at various stages of ripeness and can be made dry. BA, TBA and Eiswein are concentrated on the vine and end up sweet.","x":1},
{"c":8,"q":"Which two Prädikat categories are made from botrytis-affected grapes?","o":["Eiswein and Trockenbeerenauslese","Beerenauslese and Trockenbeerenauslese","Kabinett and Spätlese","Auslese and Eiswein"],"a":1,"e":"BA comes from berries concentrated by botrytis, and TBA from berries 'dried' by botrytis. Eiswein is the trap: frozen grapes, no botrytis.","x":1},
{"c":8,"q":"What term on a German label tells you the wine is dry?","o":["Landwein","Kabinett","Halbtrocken","Trocken"],"a":3,"e":"Trocken means dry. Halbtrocken looks similar but means the wine has some sweetness.","x":1},
{"c":8,"q":"Rieslings from Eden Valley and Clare Valley are known to be:","o":["Full-bodied and oaky","Dry, with lime, peach, blossom and petrol","Off-dry and light like the Mosel","Sweet and botrytised"],"a":1,"e":"Their higher altitude gives them moderate climates, and they make refreshing dry Rieslings with lime, peach, blossom and petrol.","x":1},
{"c":8,"q":"Why do many consumers think Riesling is 'too sweet'?","o":["Riesling can't be fermented to dryness","It's often wrongly linked to cheap sweetened Liebfraumilch","All Riesling is legally required to be sweet","Its high acidity tastes like sugar"],"a":1,"e":"Its German roots mean it's often confused with Liebfraumilch, a low-quality sweetened style that has fallen out of fashion.","x":1},
{"c":8,"q":"When did Australia start growing Riesling?","o":["The early 19th century","The early 21st century","It was first planted in the 1990s","The 1970s"],"a":0,"e":"Australia has been growing Riesling since the early 19th century.","x":1},
{"c":8,"q":"Which three German regions does the book highlight for great Riesling?","o":["Mosel, Alsace and Pfalz","Pfalz, Clare and Eden","Rheingau, Barossa and Mosel","Mosel, Rheingau and Pfalz"],"a":3,"e":"The three German regions covered are the Mosel, the Rheingau and the Pfalz.","x":1},
{"c":23,"q":"What are the two most important black grapes of central Italy?","o":["Sangiovese and Nebbiolo","Sangiovese and Montepulciano","Corvina and Primitivo","Nebbiolo and Barbera"],"a":1,"e":"Sangiovese and Montepulciano both thrive in central Italy's warm climate.","x":1},
{"c":23,"q":"Which are the important Sangiovese-based DOCGs of Tuscany?","o":["Barolo, Barbaresco, Chianti and Brunello","Chianti, Chianti Classico, Chianti Classico Riserva and Brunello di Montalcino","Montepulciano d'Abruzzo, Chianti and Brunello","Chianti, Valpolicella and Soave"],"a":1,"e":"All four are Sangiovese-based Tuscan DOCGs. Montepulciano d'Abruzzo is a different grape from a different region.","x":1},
{"c":23,"q":"Which Tuscan DOCG produces many simple, inexpensive Sangioveses that aren't meant for ageing?","o":["Chianti Classico DOCG","Chianti Classico Riserva DOCG","Chianti DOCG","Brunello di Montalcino DOCG"],"a":2,"e":"Chianti DOCG covers a wide area and its quality varies. Many wines labelled Chianti DOCG are simple and inexpensive.","x":1},
{"c":23,"q":"Where is the town of Montalcino within Tuscany?","o":["The east, in Abruzzo","The south","The coast","The north"],"a":1,"e":"Brunello di Montalcino comes from the warm, sunny town of Montalcino in southern Tuscany.","x":1},
{"c":11,"q":"Sauvignon Blanc grows best in which climates?","o":["Cool and moderate","Hot only","Moderate and warm","Warm and hot"],"a":0,"e":"It grows best in cool and moderate climates. In warm places, like much of the South of France or California, producers have to find cooler sites.","x":1},
{"c":11,"q":"Why are single-varietal Sauvignon Blancs most often made in inert vessels?","o":["Oak is banned for Sauvignon Blanc","Sauvignon Blanc is too acidic for oak","Inert vessels add flavours of smoke and vanilla","Their herbaceous aromas are easily overwhelmed by new oak"],"a":3,"e":"Its distinctive herbaceous characters can easily be overwhelmed by new oak flavours, so most are made in inert vessels.","x":1},
{"c":11,"q":"Which two French regions are best known for Sauvignon Blanc?","o":["Alsace and Burgundy","Champagne and the Loire","The Rhône and Provence","The Loire and Bordeaux"],"a":3,"e":"The Loire makes it as a single varietal in Sancerre and Pouilly-Fumé, and Bordeaux usually blends it with Sémillon.","x":1},
{"c":11,"q":"What's the climate of Sancerre and Pouilly-Fumé?","o":["Cool","Hot and dry","Warm","Moderate to warm"],"a":0,"e":"These two appellations face each other across the Loire River and have a cool climate.","x":1},
{"c":11,"q":"In the cool Loire Valley, what characteristics does Sauvignon Blanc show?","o":["Pronounced passion fruit and green pepper","Sweet, with apricot and honey","Full-bodied, tropical and oaky","Dry, high acidity, apple, grass, asparagus and sometimes wet stones"],"a":3,"e":"The Loire's cool climate gives dry wines with high acidity, green apple, grass, asparagus and sometimes wet stones.","x":1},
{"c":11,"q":"Which three Bordeaux appellations are known for Sauvignon Blanc?","o":["Saint-Émilion AOC, Pomerol AOC and Graves AOC","Sancerre AOC, Pouilly-Fumé AOC and Touraine AOC","Sauternes AOC, Pauillac AOC and Margaux AOC","Bordeaux AOC, Graves AOC and Pessac-Léognan AOC"],"a":3,"e":"Simple Bordeaux AOC is fresh and grassy, while Graves and Pessac-Léognan are more concentrated and complex.","x":1},
{"c":11,"q":"Of those three Bordeaux appellations, which makes the simplest Sauvignon Blanc?","o":["Graves AOC","They're all the same style","Bordeaux AOC","Pessac-Léognan AOC"],"a":2,"e":"Bordeaux AOC is the simple one, with fresh grass and green apple. Graves and Pessac-Léognan are more concentrated, and the best are oak-matured.","x":1},
{"c":11,"q":"Why isn't there much Sauvignon Blanc in the South of France?","o":["The soils are too stony","The law only allows red grapes there","Much of the region is too warm for it","It's too cold and wet"],"a":2,"e":"Much of the South of France is too warm. Its best Sauvignon Blancs come from areas cooled by altitude.","x":1},
{"c":11,"q":"Why are there so many different styles of Marlborough Sauvignon Blanc?","o":["They're all heavily oaked","They're always blended with Semillon","They're always made from a single vineyard","They're blended across sites, or from grapes picked at different ripeness levels"],"a":3,"e":"Blending across different sites or ripeness levels gives a broad range of fruit, from lemon to passion fruit, alongside green pepper and asparagus.","x":1},
{"c":11,"q":"In Australia's Margaret River, Sauvignon Blanc is most commonly:","o":["Blended with Semillon","Made into sparkling wine","Blended with Chardonnay","Bottled as a single varietal"],"a":0,"e":"Margaret River makes it as a single-varietal wine or, more commonly, as part of a blend with Semillon.","x":1},
{"c":11,"q":"What cools Sauvignon Blanc vineyards in the Adelaide Hills?","o":["Altitude and ocean breezes","Cloud cover from the mountains","Its northerly latitude","Morning fog from the Pacific"],"a":0,"e":"Sauvignon Blanc is the most widely planted grape here, and the vineyards are cooled by altitude and ocean breezes.","x":1},
{"c":11,"q":"Which two Chilean regions make Sauvignon Blanc from acceptable to very good quality?","o":["Mendoza and Casablanca","Marlborough and Casablanca","Maipo and Colchagua","Casablanca Valley and the Central Valley"],"a":3,"e":"Casablanca has a reputation for very good Sauvignon Blanc, and the larger Central Valley makes a range from inexpensive brands to very good wines.","x":1},
{"c":11,"q":"What makes Casablanca Valley a good place for Sauvignon Blanc?","o":["A hot, dry climate","Its northerly latitude","High altitude in the Andes","It's cooled by sea breezes and morning fogs"],"a":3,"e":"It's a coastal region cooled by both sea breezes and morning fogs.","x":1},
{"c":11,"q":"What cools South Africa's Constantia region?","o":["Sea breezes from the Southern Ocean","Morning fog from a bay","Cloud cover","Altitude"],"a":0,"e":"Constantia, south of Cape Town, is cooled by Southern Ocean breezes and makes refreshing Sauvignon Blanc with tropical-fruit and herbaceous aromas. Elgin is the one cooled by altitude.","x":1},
{"c":11,"q":"Where in California are very good examples of the fresh, herbaceous Sauvignon Blanc style found?","o":["All of California equally","The cooler areas of Napa Valley","The Central Valley","Sonoma's warmest sites"],"a":1,"e":"Most of California is too warm, so the best come from cooler areas such as parts of Napa Valley, where grapes may be picked early.","x":1},
{"c":11,"q":"What stylistic choice do some Napa Valley producers make with Sauvignon Blanc?","o":["Using oak contact for body and smoky flavour","Using botrytis-affected grapes","Making it sparkling with the tank method","Adding Süssreserve to make it sweet"],"a":0,"e":"These wines are sometimes made in contact with oak, adding body and flavours like smoke.","x":1},
{"c":9,"q":"Sémillon/Semillon grows primarily in which climates?","o":["Hot only","Cool only","Cool and moderate","Moderate and warm"],"a":3,"e":"It grows mainly in moderate and warm climates. Sauvignon Blanc, its usual blending partner, prefers cool and moderate.","x":1},
{"c":9,"q":"When is the grape spelled 'Sémillon' and when 'Semillon'?","o":["Sémillon for sweet wines, Semillon for dry","Sémillon in France, Semillon in English-speaking countries","Semillon in France, Sémillon in Australia","They're two different grapes"],"a":1,"e":"The accent is the French spelling. English-speaking places, like Australia, drop it.","x":1},
{"c":9,"q":"What range of body and acidity can Semillon wines have?","o":["Low to medium acidity, medium body","Medium to high acidity, light to full body","High acidity, light body only","Low acidity, full body only"],"a":1,"e":"Depending on ripeness, Semillon ranges from medium to high acidity and from light to full body.","x":1},
{"c":9,"q":"What is France's most important region for Sémillon, and what styles does it make there?","o":["Bordeaux, for sweet wines only","The Loire, for dry wines only","Alsace, for late-harvest wines","Bordeaux, for both dry and sweet wines"],"a":3,"e":"Bordeaux is the most important, and Sémillon goes into both dry and sweet wines there, usually with Sauvignon Blanc.","x":1},
{"c":9,"q":"Where is Sauternes AOC?","o":["In north-east Hungary","A small sub-region of Bordeaux","In the Loire Valley","In Alsace"],"a":1,"e":"Sauternes is a small wine sub-region of Bordeaux, making sweet whites from botrytised grapes.","x":1},
{"c":9,"q":"Outside France, which English-speaking country has significant plantings of Semillon?","o":["South Africa","Australia","The USA","New Zealand"],"a":1,"e":"Australia has significant plantings, used for blends with Sauvignon Blanc, botrytised sweet wines and several dry styles.","x":1},
{"c":9,"q":"Hunter Valley Semillon is typically made in:","o":["Inert vessels, and bottled young","New oak barrels","Old oak, aged for years before bottling","Large oak casks with lees stirring"],"a":0,"e":"The grapes are picked early, then the wines are made in inert vessels and bottled young. Their honey and nut flavours come from years in bottle.","x":1},
{"c":9,"q":"Besides Hunter Valley, which Australian region makes Semillon, and in what styles?","o":["Eden Valley, always sparkling","Margaret River, only single varietals","Barossa Valley, always sweet","Barossa Valley, from Hunter-like wines to full-bodied oaked ones"],"a":3,"e":"Barossa Valley Semillon ranges from wines very similar to Hunter Valley to full-bodied, oak-matured wines.","x":1},
{"c":24,"q":"What are the bubbles in sparkling wine?","o":["Dissolved oxygen","Air trapped during riddling","Nitrogen added at bottling","Dissolved carbon dioxide"],"a":3,"e":"The bubbles are dissolved carbon dioxide. It can be pumped in, but most premium producers use the carbon dioxide made naturally during fermentation.","x":1},
{"c":24,"q":"How do most premium sparkling-wine producers get the bubbles into the wine?","o":["By adding sugar at dosage","By pumping carbon dioxide through the wine","By keeping the carbon dioxide made during fermentation","By shaking the bottle during riddling"],"a":2,"e":"Carbon dioxide can be pumped in, but premium producers harness the gas that's naturally made as fermentation happens.","x":1},
{"c":24,"q":"What are the two main methods of making sparkling wine?","o":["Carbonic maceration and tank fermentation","Solera and tank fermentation","Barrel fermentation and bottle fermentation","Bottle fermentation and tank fermentation"],"a":3,"e":"Most sparkling wines are made by bottle fermentation or tank fermentation.","x":1},
{"c":24,"q":"A sparkling-wine base wine is usually a blend of:","o":["Red and white wine only","Different vintages, varieties and/or villages","Grape juice and sugar only","Wine and spirit"],"a":1,"e":"The base wine is usually a blend of wines from different vintages, varieties and/or villages.","x":1},
{"c":24,"q":"How is the second fermentation started?","o":["Spirit is added to the base wine","The wine is frozen","Sugar and wine are added after disgorgement","Sugar and yeast are added to the dry base wine"],"a":3,"e":"Sugar and yeast are added to the dry base wine, and the yeast turn the sugar into alcohol and carbon dioxide.","x":1},
{"c":24,"q":"What are the two main by-products of the second fermentation?","o":["Oxygen and lees","Sugar and acid","Tannin and colour","Alcohol and carbon dioxide"],"a":3,"e":"The yeast convert the sugar into alcohol and carbon dioxide. The alcohol raises the abv by around 1.5%.","x":1},
{"c":24,"q":"How is the carbon dioxide kept in the wine during the second fermentation?","o":["The wine is chilled until the gas dissolves","It's pumped back in after fermentation","The fermentation takes place in a sealed bottle or tank","Dosage traps the gas"],"a":2,"e":"To stop the gas escaping, the second fermentation has to happen in a sealed vessel: a bottle or a tank.","x":1},
{"c":24,"q":"What's another name for the most common bottle-fermentation method, and which famous wines use it?","o":["The solera method: Champagne and Cava","The traditional method: Champagne and Cava","The Asti method: Champagne and Cava","The tank method: Prosecco and Asti"],"a":1,"e":"The traditional method is the most common and highly regarded bottle fermentation, famously used for Champagne and Cava.","x":1},
{"c":24,"q":"In the traditional method, what happens right after sugar and yeast are added to the base wine?","o":["The wine is bottled and sealed with a crown cap","The wine is put in a sealed tank","The lees are frozen and removed","The wine is topped up with liqueur d'expédition"],"a":0,"e":"Sugar and yeast go into the base wine, which is bottled and sealed with a crown cap. The second fermentation then happens in that bottle.","x":1},
{"c":24,"q":"What is the climate of Champagne, and why does it suit sparkling wine?","o":["Cool, ideal for base wines with low alcohol and high acidity","Hot, so the grapes are picked early","Moderate, giving full-bodied base wines","Warm, giving very ripe fruit"],"a":0,"e":"Champagne's cool climate is ideal for making a base wine with low alcohol and high acidity.","x":1},
{"c":24,"q":"The least expensive non-vintage Champagnes are typically:","o":["Low in acidity with tropical fruit","Sweet with pronounced nutty, honeyed notes","Dry with high acidity, apple and light autolytic flavours","Full of floral, grapey aromas"],"a":2,"e":"They spend only the legal minimum on their lees, so autolytic flavours are light. Vintage Champagnes, aged much longer, add nuts and honey.","x":1},
{"c":24,"q":"What does the dosage decide?","o":["The final sweetness of the wine","The colour of the wine","How long the wine ages on its lees","The final alcohol level"],"a":0,"e":"The dosage determines the final sweetness. Most wines are labelled Brut, which tastes dry, while Demi-Sec is medium-sweet.","x":1},
{"c":24,"q":"How are traditional-method and tank-method bottles usually sealed?","o":["With a screw cap","With a thick cork and a wire cage","With a crown cap","With a normal still-wine cork"],"a":1,"e":"Both end up sealed with a thick cork and a wire cage. The crown cap is only used during the second fermentation in the bottle.","x":1},
{"c":24,"q":"Besides Chardonnay and Pinot Noir, which grape do some South African sparkling-wine producers use?","o":["Moscato","Chenin Blanc","Pinotage","Glera"],"a":1,"e":"Méthode Cap Classique sometimes uses the Champagne grapes and sometimes other varieties, such as Chenin Blanc.","x":1},
{"c":24,"q":"Which sparkling-wine method suits aromatic grape varieties best?","o":["The traditional method","The solera method","Long ageing on the lees","The tank method"],"a":3,"e":"The tank method adds no autolytic flavours, so it's used when the winemaker wants the aromas of the grape, as with aromatic varieties.","x":1},
{"c":24,"q":"Which Italian region does Asti DOCG come from?","o":["Tuscany","Veneto","Puglia","Piemonte"],"a":3,"e":"Asti DOCG is a sweet, low-alcohol sparkling wine from Piemonte in north-west Italy.","x":1},
{"c":24,"q":"Asti DOCG is usually:","o":["Still","Gently sparkling","Dry and fully sparkling","Fully sparkling"],"a":3,"e":"Asti DOCG is sweet, fruity, light-bodied and usually fully sparkling.","x":1},
{"c":24,"q":"Where is Prosecco DOC from, and how is it usually made?","o":["North-west Italy, by the traditional method","North-east Italy, by the tank method","North-east Italy, by the traditional method","Catalunya, by the traditional method"],"a":1,"e":"Prosecco DOC is from north-east Italy and is typically made using the tank method, from Glera.","x":1},
{"c":24,"q":"What is Catalunya's climate, and how does that affect grapes for Cava?","o":["Cool, so grapes are left late to ripen","Hot, so the grapes are dried before fermenting","Warm, so grapes may be picked early to keep acidity","Cool, ideal for low-alcohol base wines"],"a":2,"e":"Catalunya's warm climate means the grapes may need to be picked early to keep their high acidity.","x":1},
{"c":24,"q":"Which generally has more pronounced autolytic flavours: Champagne or Cava?","o":["Champagne","Cava","Neither has any autolytic flavours","They're always identical"],"a":0,"e":"Most Cava ages on its lees for less time than Champagne, so its autolytic characters are very subtle.","x":1},
{"c":24,"q":"Which two international grapes are allowed in Cava, and what do they add?","o":["Chardonnay and Pinot Noir, adding fruit and acidity","Chardonnay and Pinot Noir, adding sweetness","Glera and Moscato, adding floral notes","Cabernet Sauvignon and Merlot, adding tannin"],"a":0,"e":"Cava is mainly from local Spanish grapes, but Chardonnay and Pinot Noir are also permitted and add fruit and acidity.","x":1},
{"c":24,"q":"Who makes most Cava?","o":["Co-operatives in Champagne","A small number of large brands","Small family-run producers","Mainly Prosecco producers"],"a":1,"e":"Cava production is dominated by a few large brands making high volumes of simple non-vintage wine, though many smaller producers make very good, long-aged Cavas.","x":1},
{"c":24,"q":"Outside France and Spain, where does the book note important bottle-fermented sparkling-wine producers?","o":["Germany and Hungary","Argentina and Chile only","Only in Italy","South Africa, California, Australia and New Zealand"],"a":3,"e":"There are important producers in South Africa, California, Australia and New Zealand, usually in their coolest regions.","x":1},
{"c":16,"q":"What is Syrah called in France and in Australia?","o":["Shiraz in France, Syrah in Australia","Syrah in France, Shiraz in Australia","They're different grapes","Syrah in both"],"a":1,"e":"Syrah and Shiraz are the same grape. Syrah is the French name and Shiraz is the name used in Australia.","x":1},
{"c":16,"q":"A typical warm-climate Shiraz, such as from Australia, is:","o":["Medium-bodied, with fresh black fruit and black pepper","Pale with high acidity and cherry","Full-bodied and high in alcohol, with cooked black fruit and liquorice","Light-bodied, with red fruit and earth"],"a":2,"e":"In warmer parts of Australia, Shiraz is full-bodied and high in alcohol, with ripe cooked black fruit and liquorice.","x":1},
{"c":16,"q":"How common is oak maturation for Syrah/Shiraz?","o":["Rare, to keep its pepper aromas","Banned in the Northern Rhône","Only for rosé","Common, to soften tannins and add smoke and spice"],"a":3,"e":"Oak maturation is common. It softens the tannins and adds flavours of smoke and spice.","x":1},
{"c":16,"q":"What's the climate of the Northern Rhône, and what helps the grapes ripen?","o":["Cool, helped by fog","Warm Mediterranean, helped by large stones","Hot, so no help is needed","Moderate, helped by aspect and sunlight reflected off the river"],"a":3,"e":"It's moderate, and ripening is helped by the slopes' aspect and sunlight reflected from the river.","x":1},
{"c":16,"q":"Which appellation marks the northern limit where Syrah will successfully ripen?","o":["Crozes-Hermitage AOC","Côte Rôtie AOC","Hermitage AOC","Châteauneuf-du-Pape AOC"],"a":1,"e":"Côte Rôtie is in the far north of the Northern Rhône and is the northern limit for ripening Syrah.","x":1},
{"c":16,"q":"Which way does the hill of Hermitage face?","o":["East","South","West","North"],"a":1,"e":"One steep, south-facing hill makes up the whole Hermitage appellation.","x":1},
{"c":16,"q":"Where is Minervois AOC, and what is Syrah's role there?","o":["Australia, as a Shiraz region","Bordeaux, where Syrah is blended with Merlot","The Northern Rhône, where Syrah must be 100%","The South of France, where Syrah is sometimes blended into its wines"],"a":3,"e":"In the warm South of France, Syrah ripens reliably. It's sometimes blended into appellation wines such as Minervois AOC, or made as a single varietal under Pays d'Oc IGP.","x":1},
{"c":16,"q":"Wines labelled South Eastern Australia are generally:","o":["Old-vine wines from the Barossa Valley","Inexpensive, high-volume brands from warm inland regions","The country's most expensive Shiraz","Cool-climate wines from high altitude"],"a":1,"e":"Much of Australia's Shiraz grows in warm inland regions and goes into inexpensive, high-volume brands labelled South Eastern Australia.","x":1},
{"c":16,"q":"Which two Australian regions does the book highlight for high-quality Shiraz?","o":["Coonawarra and Margaret River","Eden Valley and Clare Valley","Yarra Valley and Mornington Peninsula","Barossa Valley and Hunter Valley"],"a":3,"e":"Barossa makes full-bodied, concentrated Shiraz from very old vines, and Hunter Valley makes a medium-bodied, fresher style.","x":1},
{"c":16,"q":"What's the climate of the Barossa Valley, and what style of Shiraz does it make?","o":["Cool: light-bodied with red fruit","Warm: full-bodied, ripe tannins, cooked black fruit, pepper and oak spice","Warm: light, simple and fruity","Moderate: medium-bodied with fresh black fruit"],"a":1,"e":"Barossa is warm, and its old vines give low yields of very concentrated fruit. The wines are full-bodied with high, ripe tannins, cooked black fruit, black pepper and often vanilla and coffee from oak.","x":1},
{"c":16,"q":"Hunter Valley is warm. What slows grape ripening there?","o":["High altitude","Morning fog from a bay","High cloud cover and summer sea breezes","Cold ocean currents from the South Pole"],"a":2,"e":"Hunter Valley is warm, but high cloud cover and sea breezes in summer slow ripening, giving medium-bodied Shiraz.","x":1},
{"c":19,"q":"Tempranillo is the most prized black grape of which country?","o":["Spain","Portugal","France","Italy"],"a":0,"e":"Tempranillo is Spain's most prized black grape and part of many of its most famous reds.","x":1},
{"c":19,"q":"Which two Spanish regions are most important for quality Tempranillo?","o":["Jerez and Rioja","Catalunya DO and Navarra DO","Rioja DOCa and Ribera del Duero DO","Priorat and Rías Baixas"],"a":2,"e":"Rioja makes Spain's most famous Tempranillo-based wines, and very good to outstanding wines come from Ribera del Duero.","x":1},
{"c":19,"q":"Which broad region in north-east Spain makes high volumes of Tempranillo?","o":["Ribera del Duero DO","Catalunya DO","Priorat DOCa","Rías Baixas DO"],"a":1,"e":"Spain's broad Catalunya DO makes high volumes of Tempranillo and Tempranillo blends, from simple to powerful and oak-aged.","x":1},
