{"c":19,"q":"What range of styles can Tempranillo make?","o":["Dry reds from simple and fruity to ripe, complex and age-worthy","Dry and sweet reds","Only full-bodied, oak-aged reds","Only light, fruity reds for early drinking"],"a":0,"e":"It's a versatile grape making dry reds that range from simple, fruity and inexpensive to ripe, complex and age-worthy.","x":1},
{"c":19,"q":"For Tempranillo wines made for long ageing, what is often done?","o":["It's blended with Garnacha for early drinking","It's always bottled as a single varietal","Small amounts of other grapes are blended in for acidity and tannin","It's made sweet to help it last"],"a":2,"e":"Small proportions of other grapes may be blended in to boost acidity and tannin. Garnacha tends to go into wines for early drinking.","x":1},
{"c":19,"q":"A Reserva red wine from Spain typically shows:","o":["Only fresh primary fruit","Oak flavours but no tertiary notes","Softer tannins, cooked or dried fruit, oak and tertiary notes","The most pronounced tertiary aromas of all"],"a":2,"e":"Reserva ages in oak and in bottle. The tannins soften, some fresh red fruit turns cooked or dried, and you get layers of primary fruit, oak and tertiary notes like dried fruit and mushroom.","x":1},
{"c":7,"q":"What grape makes White Zinfandel?","o":["Grenache","Chardonnay","A blend of white grapes","Zinfandel, a black grape"],"a":3,"e":"Despite the 'white' in the name, it's a medium-sweet rosé made from the black Zinfandel grape.","x":1},
{"c":7,"q":"How is White Zinfandel typically made?","o":["By fermenting fully dry on the skins","By the short-maceration rosé process, with the yeasts removed before fermentation finishes","By adding spirit to stop fermentation","By blending red and white wine"],"a":1,"e":"It's usually made by short maceration. Removing the yeasts before fermentation finishes leaves a low-alcohol wine, typically 8–10%, with medium sweetness.","x":1}
];

const QT=["Wines with a noticeable blue or purple colour are described as 'purple'.", "The most common colour for red wine is 'ruby'.", "If there is a noticeable orange or brown colour but the wine is still more red than brown, it is described as 'garnet'.", "If the wine is more brown than red, it may be described as 'tawny'.", "The most common colour for white wines is 'lemon'.", "If there is a hint of orange or brown, the wine is 'gold'.", "Wines with a very noticeable level of browning could be described as 'amber'.", "When assessing colour, white wines can be placed on a scale that runs from 'lemon' to 'amber'.", "If there is a noticeable orange or brown colour but the wine is still more red than brown, it is described as 'garnet'. The colour in a red wine will change from ruby to garnet to tawny and it will also typically become paler in intensity.", "These are the aromas that come from the grapes or are created during the fermentation process.", "These aromas are created by post-fermentation winemaking. Secondary aromas also include cream and butter characteristics from malolactic conversion or the toasted-bread and biscuit aromas that can develop as a result of autolysis in sparkling wines.", "These aromas have their origin in the ageing processes.", "Cork taint is caused by the chemical known as TCA (Trichloroanisole).", "The cool climate here produces dry wines with high acidity and flavours of apple, lemon and wet stones.", "The taint gives wines aromas reminiscent of damp cardboard.", "High natural acidity preserves the freshness of the wine while it develops complex tertiary flavours of honey and petrol (gasoline).", "Its wines are characterised by their pronounced herbaceous (grass, green bell pepper/capsicum, asparagus) and floral (blossom) aromas.", "In wines, balance can be thought of as a set of scales, with one element of the wine helping to balance another. Sugar in wine can be balanced by acidity, making the wine seem more refreshing.", "Alcohol t with their lees.", "Coastal influences moderate the climate allowing for a longer, slower ripening season.", "In Northern California, Carneros is cooled by morning fogs that come in from the San Pablo Bay. The coastal vineyards of Sonoma are cooled by Pacific sea breezes.", "The vineyards receive cooling sea breezes that are funnelled inland by lateral valleys.", "Styles vary from wines that are similar to those of the Côte de Beaune, through to more tropical-fruit-flavoured wines with higher alcohol and more pronounced flavours from new oak.", "Oregon — The state of Oregon has a climate that is generally moderate. Oregon Chardonnay wines often have refreshingly high acidity and a broad range of flavours from citrus fruit (lemon) to tropical notes (melon).", "High-volume Chardonnays labelled South Eastern Australia can be made from grapes grown anywhere within a very broad area, though the fruit often comes from warm, irrigated inland vineyards.", "These moderating influences allow for a longer growing season and produce wines with ripe stone-fruit flavours (peach) and sometimes tropical fruit (pineapple, banana).", "The Marlborough region, in the north-eastern part of New Zealand's South Island, is a cool to moderate region.", "It has prominent ocean influences including sea breezes and plentiful rainfall.", "The larger and warmer Central Valley produces wines across a range of quality levels, from inexpensive high-volume brands to outstanding examples from vineyards that are moderated by altitude.", "The hot inland vineyards of South Africa's Western Cape are mostly dedicated to high-volume branded wines. Here, Chardonnay is sometimes blended with other white varieties such as Chenin Blanc.", "The coastal Walker Bay region is among the coolest in South Africa due to its exposure to strong sea breezes from the south.", "Producers today are much more careful not to overpower the fruit flavours in their wines with flavours from oak.", "At the premium end of the market, Chardonnay is regarded highly for its ability to express the attributes of a particular climate or vineyard, as well as the skill of the winemaker.", "It grows well in cool, moderate and warm climates and its flavours vary according to ripeness from green fruit (apple) and citrus (lemon) through to stone fruit (peach) and tropical fruit (pineapple, mango).", "They are typically dry and medium-bodied with flavours of peach, pineapple and sometimes vanilla from oak chips or staves.", "Dry Vouvray AOC often has fresh apple flavours. Sweeter styles are typically made from extra-ripe or botrytis-affected grapes and can have stone-fruit or tropical-fruit aromas.", "Due to its high acidity, very good or outstanding-quality examples can age in the bottle for many years. The best wines of all styles can age in bottle and develop notes of honey and dried fruit.", "Although Tokaj also produces dry and medium wines, it is most famous for producing Tokaji Aszú, a sweet wine made from grapes that have been affected by botrytis.", "The sweetness and full body are balanced by high acidity and the finish is typically long and intense.", "Wines from 'cru' appellations are the most concentrated and structured wines of the region.", "Wines from Beaujolais are sometimes served lightly chilled to highlight their refreshing acidity and to preserve their delicate fruit flavours.", "This grape variety is thought to have evolved in Spain where it is called Garnacha.", "Over time in the bottle, Grenache can develop complex flavours of earth, meat and dried fruit.", "Here the valley flattens out and the climate is warm due to the southerly latitude.", "Châteauneuf-du-Pape AOC is known for full-bodied wines with high alcohol levels.", "Grenache is also used in blends with Shiraz and other varieties — these wines can be similar in style and quality to the wines of Châteauneuf-du-Pape AOC.", "Garganega produces dry, medium-bodied wines with high acidity.", "Soave is typically fermented in inert vessels and is not matured in oak.", "Climate is made up of a combination of heat, sunlight and water availability.", "Climate describes the average levels of temperature, sunlight and rainfall that a region can typically expect. Weather describes what actually happens in a region on a day-to-day basis.", "Temperature is so important because it determines what grape varieties can grow successfully in a wine region as well as the flavour characteristics they can develop.", "The most important factor that influences a wine region's climate is latitude.", "Temperatures drop with altitude. A vineyard that is located at a higher altitude will always have a cooler climate than a vineyard located at the same latitude but with a lower altitude.", "Rivers take longer to warm up and cool down than land. They provide warmth in cooler regions and help to extend the growing season.", "Cold air from mountains can move down to lower altitudes at night, cooling down warmer vineyards where heat can build up during the day.", "Mountains — Mountains can act as a barrier, sheltering vineyards from clouds, rain and cold winds.", "Hail — Hail can cause significant damage to vines and grapes. Heavy hail storms have the potential to destroy a vineyard's entire annual crop of grapes.", "In these conditions, the vine will be unable to ripen its grapes, and in the worst cases it may die.", "A GI is a legally defined vineyard area within a country.", "Merlot is a black grape variety that grows in moderate and warm climates.", "The Bordeaux region in south-west France is the classic home of Merlot.", "Both oaked and unoaked styles are made: while a lighter style of Merlot has little need for extended barrel maturation, a fuller-bodied style may benefit from the softness and flavour complexity gained through oak maturation.", "The region is naturally segmented by the Gironde Estuary, where the Garonne and Dordogne Rivers meet.", "Wines labelled Bordeaux AOC or Bordeaux Supérieur AOC are typically Merlot-dominated blends.", "It is possible to find single-varietal Merlot across all quality levels as well as blends with other black grape varieties such as Cabernet Sauvignon, Grenache and Syrah.", "Styles range widely from fruity, medium-bodied wines labelled California through to concentrated, full-bodied examples from the neighbouring regions of Napa Valley and Sonoma.", "It is common to taste pronounced flavours from oak (vanilla, coconut, smoke) in red wines from California.", "The region of Stellenbosch in South Africa has developed a strong reputation for complex, age-worthy red wines from classic Bordeaux varieties.", "This region has a moderate climate with plentiful rainfall.", "Northern Italy's vineyard regions are located in the foothills of the Alps and on the large, flat plain of the Po River.", "Many of the finest vineyard areas benefit from the protection of the mountains to the north and the broad variety of slopes and soils that they provide.", "It is often matured for extended periods of time in oak to soften its high levels of tannin.", "Appassimento is widely used in the Veneto region. Recioto di Soave DOCG is a sweet white wine made in the Soave region using the appassimento method.", "It grows primarily in cool or moderate climates and produces two distinct styles that are determined principally by grape-growing and harvesting choices.", "Alsace AOC — This is the regional appellation that covers the entire area.", "Alsace Grand Cru AOC — This appellation covers specific vineyards that are mostly found on the steeply sloped foothills of the Vosges Mountains, facing east/south-east.", "This means 'late harvest' in French but as a labelling term it can only be used in Alsace.", "Both Alsace and Alsace Grand Cru wines can be labelled VT.", "Lighter styles of Pinot Grigio are best consumed while fresh and young, as their simple flavours fade within a short time in the bottle.", "Pinot Noir is most commonly produced as a single-varietal wine, with the notable exception of sparkling wines such as Champagne.", "The best sites are located on south- and south-east-facing slopes that benefit from extra sunlight and are capable of producing concentrated and complex wines suitable for bottle ageing.", "The vineyards of Burgundy are very spread out but the most celebrated vineyards are located in a specific part of the region called the Côte d'Or.", "They generally offer more flavour intensity, complexity and length on the finish than a typical Bourgogne AOC.", "Premier cru and grand cru wines — The most complex and intense wines of Burgundy are produced from the prestigious premier cru and grand cru vineyards.", "Much of California is too warm for Pinot Noir, but there are a small number of regions close to the coast that produce very good or outstanding examples of Pinot Noir.", "Californian Pinot Noirs tend to have ripe red-fruit flavours (strawberry, red cherry) and often notable flavours from oak (vanilla).", "Santa Barbara County in California's Central Coast is also cooled by sea breezes from the west and south.", "It is well suited to the cool to moderate climates of Martinborough and Marlborough that each produce very good and outstanding examples. Despite its southerly latitude, Central Otago produces New Zealand's ripest and most powerfully flavoured Pinot Noir.", "It is made from a blend of local black grape varieties; most Ports are blends of wines from several vintages.", "As with Sherry, the maturation process plays an important role in determining the different styles of Port.", "Reserve Ruby Ports use better-quality wines with greater flavour intensity.", "Vintage Port is made from the highest-quality wines from a single exceptional vintage. It will form a thick sediment and will need to be decanted before serving.", "Over time, oxygen attacks the colour, turning it from ruby to tawny and the wine develops complex notes of dried fruit and deliberate oxidation (walnut, coffee, caramel).", "The three most important styles of dry Sherry are Fino, Oloroso and Amontillado.", "They are distinct from one another largely due to different ageing periods and conditions within the solera.", "This method of ageing under a layer of flor is known as biological ageing.", "Rosé Zinfandels typically have a low abv whereas red Zinfandels typically have a high abv.", "These wines are commonly matured in oak to soften the tannins and add flavour complexity.", "White Zinfandel is a medium-sweet rosé wine made from Zinfandel. It is dry with medium to high acidity and tannin, high alcohol and a full body.", "The resulting wines can develop tertiary flavours (earth, meat) in the bottle.", "With its naturally high acidity and susceptibility to botrytis/noble rot, it is suitable for the production of outstanding-quality wines at all sweetness levels.", "The sweetest styles are made using extra-ripe grapes; the grape juice is so high in sugar that the fermentation stops naturally.", "Mosel — Due to the Mosel's northerly latitude, Rieslings from this area are typically lighter in body than those from more southerly regions.", "The best vineyards are planted on steep south- or south-east-facing slopes on the banks of the Mosel River, where stony soils and reflected sunlight from the river aid grape ripening.", "Rheingau — The vineyards of the Rheingau region are situated on steep, south-facing slopes on the north bank of the River Rhine.", "Climatically it can be considered an extension of France's Alsace region (covered later in this chapter) and the wines are similar in style.", "It is therefore one of the driest and sunniest wine-producing regions in all of France.", "The best vineyards are planted in the mountain foothills facing east or south-east to benefit from the morning sun.", "While many wines carrying these terms have some sweetness, they can also be made in a dry style.", "Kabinett, Spätlese and Auslese wines are made from grapes in various stages of ripeness.", "Its German roots mean that it is often incorrectly linked to low-quality sweetened wines known as Liebfraumilch, a style that has now fallen out of fashion.", "Australia has been cultivating Riesling vines since the early 19th century.", "Mosel — Due to the Mosel's northerly latitude, Rieslings from this area are typically lighter in body than those from more southerly regions. Rheingau — The vineyards of the Rheingau region are situated on steep, south-facing slopes on the north bank of the River Rhine. Pfalz — Towards the French border, the Pfalz region is protected by mountains to the west and has a dry, sunny climate with a long growing season.", "Sangiovese and Montepulciano are the two most important black grape varieties of central Italy.", "Chianti DOCG covers a wide area in the foothills of the Apennine Mountains and produces wines of varied quality. Chianti Classico DOCG sits at higher altitude than the wider Chianti DOCG and the Sangiovese grapes enjoy a long ripening season. Chianti Classico Riserva DOCG is subject to stricter ageing requirements and may show some tertiary characters by the time it is released. Brunello di Montalcino DOCG is a powerful and full-bodied wine from the warm and sunny town of Montalcino in southern Tuscany.", "THE CHARACTERISTICS OF SAUVIGNON BLANC Sauvignon Blanc is an aromatic white grape variety that grows best in cool and moderate climates.", "Single-varietal wines made from Sauvignon Blanc are most commonly produced in inert vessels; their distinctive herbaceous characters may be easily overwhelmed by the flavours of new oak.", "Sauvignon Blanc is the only white variety permitted in Sancerre AOC and Pouilly-Fumé AOC, two appellations of the Loire Valley. Bordeaux — In Bordeaux, Sauvignon Blanc makes a broad range of styles.", "They produce dry wines with high acidity and aromas of green fruit (apple), herbaceous notes (grass, asparagus) and sometimes wet stones.", "Simple Bordeaux AOC has fresh aromas of grass and green apple while the wines of Graves AOC and Pessac-Léognan AOC are more concentrated and complex.", "South of France — Much of the South of France is too warm for Sauvignon Blanc.", "Marlborough Sauvignon Blanc wines are often made by blending across different sites, or from grapes harvested at different ripeness levels.", "The Margaret River region in Western Australia has built a reputation for Sauvignon Blanc, both as a single-varietal wine or more commonly as part of a blend with Semillon.", "The vineyards here are cooled both by altitude and by ocean breezes.", "The coastal region of Casablanca Valley has an established reputation for producing very good-quality Sauvignon Blanc as it is cooled both by sea breezes and morning fogs. The larger Central Valley produces wines in a range of quality levels, from inexpensive high-volume brands to very good examples.", "Constantia, to the south of Cape Town, is cooled by sea breezes from the Southern Ocean.", "These wines are sometimes made in contact with oak to add body and flavour (smoke).", "Note that the spelling of this grape variety depends on whether the wine comes from France (Sémillon) or an English-speaking part of the world (Semillon).", "Depending on ripeness, Semillon wines can range from medium to high in acidity and light to full in body.", "The most important region for Sémillon in France is Bordeaux and the smaller appellations that exist within its borders. It is used in the production of both dry and sweet wines.", "Sauternes AOC is a small wine sub-region of Bordeaux.", "The wines are made in inert vessels and are bottled when young.", "Barossa Valley Semillon is made in a number of different styles.", "The bubbles in sparkling wines are created by dissolved carbon dioxide gas (CO2).", "They can be added by pumping carbon dioxide through a wine, but most premium-quality sparkling-wine producers harness the CO2 that is naturally created as a by-product of fermentation.", "Sparkling wines are mostly produced using one of two methods: bottle fermentation or tank fermentation.", "The base wine is usually a blend of different wines: these can be from different vintages, varieties and/or villages.", "The yeast convert the sugar into alcohol and CO2.", "To stop the CO2 from escaping, the second fermentation must take place in a sealed vessel.", "Sugar and yeast are added to the base wine, which is bottled and sealed with a crown cap.", "The climate in Champagne is cool. This provides ideal conditions for creating a base wine with low alcohol and high acidity.", "They are dry with high acidity, notes of apple and light autolytic flavours.", "The dosage determines the final sweetness of the wine.", "Once topped up, the bottle is resealed with a thick cork and a wire cage. The lees are removed by filtration and the wine is bottled under pressure and sealed with a thick cork and a wire cage.", "This may be the case if the base wine is made from aromatic grape varieties.", "Prosecco DOC is a sparkling wine from north-east Italy. It is typically made using the tank method.", "Catalunya's warm climate means that the grapes may need to be harvested early to retain high acidity.", "After secondary fermentation, most Cava is aged on its lees for a shorter amount of time than Champagne and has very subtle autolytic characters.", "The grape varieties used to make Cava are mainly local Spanish varieties, although Chardonnay and Pinot Noir are also permitted and can add both fruit flavours and acidity to the base wine.", "Cava production is dominated by a small number of large brands who make high volumes of simple non-vintage wines.", "South Africa, California, Australia and New Zealand In all of these places there are important producers of bottle fermented sparkling wines.", "Syrah and Shiraz are two names for the same variety. 'Syrah' is the French name while 'Shiraz' is the name most commonly used in Australia.", "Oak maturation is common in the production of Syrah/Shiraz wines.", "The climate here is moderate, but grape ripening is aided by aspect and reflected sunlight from the river.", "A large amount of the plantings are concentrated in Australia's warm inland regions where grapes are mostly used for inexpensive high-volume brands labelled South Eastern Australia.", "The warm Barossa Valley region in South Australia is home to some of the world's oldest Shiraz vines. Hunter Valley Shiraz is typically medium-bodied with medium to high tannins and fresh-black-fruit flavours.", "The Hunter Valley region in New South Wales is also warm, but high cloud cover and sea breezes during the summer months slow the ripening of the grapes.", "Tempranillo is Spain's most prized black grape variety and is a key component of many of the country's most famous red wines.", "The most famous Tempranillo-based wines in Spain come from the moderate-climate region of Rioja DOCa in north-east Spain. Very good and outstanding wines can also be found further inland in the mountainous Ribera del Duero DO region.", "Tempranillo is a versatile grape that makes a range of dry red wines from simple, fruity and inexpensive to ripe, complex and age worthy.", "For wines intended for long-term ageing, small proportions of other grape varieties may be blended in to increase acidity and tannins.", "Reserva wines must age for extended periods of time before release, both in oak barrels and in bottle.", "This style can be achieved in a number of ways, but it is typically made using the short-maceration rosé winemaking process (see Chapter 5). sweetness can be achieved by removing the yeasts before the fermentation has finished.", "At the base lies Beaujolais AOC. … A collection of villages in the north of the region have been awarded the status Beaujolais Village AOC. … Ten villages within the Beaujolais Villages area have been awarded their own appellations. These are known as the Beaujolais 'crus'."];

const KEY="wset-l2-drill-v1";
const KEY2="wset-l2-drill-v2";
const L="abcd";
let S=null, home={sel:new Set(Object.keys(CH).map(Number)), set:"all"};
const BANK=Q.filter(q=>!q.x).length, GAP=Q.filter(q=>q.x&&!q.z).length, LIVE=BANK+GAP;
let X=[];const isX=i=>X.includes(i);
const inSet=i=>!isX(i)&&!Q[i].z&&(home.set==="all"||(home.set==="gap"?!!Q[i].x:!Q[i].x));
let H={}, R=0, armed=false;
let view="home", cloud=null, sync="checking", savedAt=0, writing=false;
// score per question: 0 = never answered, wrong sets 1, right moves up 1 (max 5)
const score=k=>{const h=H[k];if(!h)return 0;return h.s!=null?h.s:(h.ok?3:1)};
const WT=[4,16,8,4,2,1];
const pool=()=>Q.map((q,i)=>i).filter(i=>inSet(i)&&home.sel.has(Q[i].c));
const mastery=ids=>ids.length?Math.round(ids.reduce((t,k)=>t+score(k),0)/(5*ids.length)*100):0;
function snapshot(){return {S,H,R,X,home:{sel:[...home.sel],set:home.set},t:savedAt}}
function purge(){for(const k in H)if((H[k].ts||0)<=R)delete H[k]}
function mergeH(o){for(const k in (o||{})){const a=H[k],b=o[k];if((b.ts||0)<=R)continue;if(!a||(b.ts||0)>(a.ts||0))H[k]=b}}
function apply(d,keepSession){d=JSON.parse(JSON.stringify(d));R=Math.max(R,d.R||0);purge();
  if(d.home){home.sel=new Set(d.home.sel);home.set=d.home.set||"all"}
  if(!keepSession&&d.S&&Number.isInteger(d.S.cur))S=d.S;
  if(S&&(!Q[S.cur]||Q[S.cur].z))S=null;
  if(S){S.soon=(S.soon||[]).filter(x=>Q[x.i]&&!Q[x.i].z);S.recent=S.recent||[];S.count=S.count||0}
  mergeH(d.H);if(Array.isArray(d.X))X=d.X.filter(n=>Number.isInteger(n)&&Q[n]&&!Q[n].z);savedAt=Math.max(savedAt,d.t||0)}
function load(){try{const r=localStorage.getItem(KEY2)||localStorage.getItem(KEY);if(r)apply(JSON.parse(r))}catch(e){}}
function save(now){savedAt=Date.now();try{localStorage.setItem(KEY2,JSON.stringify(snapshot()))}catch(e){}dirty=true;setSync(cloud?"saving":sync);clearTimeout(save.tm);if(now)flush();else save.tm=setTimeout(flush,400)}
let dirty=false, fails=0, lastCloud=0, connecting=false;
async function flush(){
  if(writing||!dirty)return;
  if(!cloud){initCloud();return}
  writing=true;dirty=false;
  try{
    // pull first so answers made on another device are kept
    try{const r=await cloud.get();if(r.exists){const d=r.data();R=Math.max(R,d.R||0);purge();mergeH(d.H)}}catch(e){}
    await cloud.set(snapshot());fails=0;lastCloud=Date.now();setSync("cloud")
  }catch(e){dirty=true;fails++;setSync("retry");setTimeout(flush,Math.min(30000,1500*2**fails)+Math.random()*1000)}
  writing=false;if(dirty&&!fails)flush()}
async function pull(){
  if(!cloud||writing)return;
  try{const r=await cloud.get();if(!r.exists)return;const d=r.data();
    const before=JSON.stringify([H,X,R]);
    if((d.t||0)>savedAt)apply(d,view!=="home");else{R=Math.max(R,d.R||0);purge();mergeH(d.H)}
    if(JSON.stringify([H,X,R])!==before){try{localStorage.setItem(KEY2,JSON.stringify(snapshot()))}catch(e){}if(view==="home")renderHome()}
  }catch(e){}}
function setSync(s){sync=s;const t=syncText();document.querySelectorAll(".syncline").forEach(el=>el.textContent=t)}
function ago(){const m=Math.round((Date.now()-lastCloud)/60000);return m<1?"just now":m+" min ago"}
function syncText(){return sync==="cloud"?"✓ Saved to your Claude account"+(lastCloud?" · "+ago():"")+". Picks up on any device.":sync==="saving"?"Saving…":sync==="retry"?"Saved on this device. Reconnecting to sync your account…":sync==="local"?"Saved on this device. Will sync to your account once it connects.":"Connecting to your account…"}
async function initCloud(){
  if(cloud||connecting)return;connecting=true;
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)throw 0;
    const id=await user.id();if(!id)throw 0;
    const ref=db.doc("data/users/"+id+"/progress");
    const snap=await ref.get();
    cloud=ref;lastCloud=Date.now();setSync("cloud");
    const d=snap.exists?snap.data():null;
    if(d){const newer=(d.t||0)>savedAt;apply(newer?d:{H:d.H,R:d.R},view!=="home");try{localStorage.setItem(KEY2,JSON.stringify(snapshot()))}catch(e){}if(view==="home")renderHome()}
    dirty=true;flush();
  }catch(e){setSync("local");setTimeout(()=>{connecting=false;initCloud()},10000+Math.random()*5000);return}
  connecting=false}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(save.tm);flush()}else{flush();pull()}});
window.addEventListener("pagehide",()=>{clearTimeout(save.tm);flush()});
window.addEventListener("online",()=>{fails=0;flush();pull()});
setInterval(()=>{if(sync==="cloud")setSync("cloud")},30000);
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- choosing the next question ----
function pickNext(){
  const ids=pool();if(!ids.length)return null;
  S.count++;
  const due=S.soon.findIndex(x=>x.at<=S.count&&ids.includes(x.i));
  if(due>=0){const i=S.soon[due].i;S.soon.splice(due,1);return i}
  const soonI=S.soon.map(x=>x.i);
  const low=ids.filter(i=>score(i)<5);
  let c=low.filter(i=>!soonI.includes(i)&&!S.recent.slice(0,2).includes(i));
  if(!c.length)c=ids.filter(i=>!soonI.includes(i)&&!S.recent.includes(i));
  if(!c.length)c=ids;
  let tot=0;const w=c.map(i=>(tot+=WT[score(i)],tot));
  const r=Math.random()*tot;return c[w.findIndex(v=>v>r)]}
function study(){if(!S)S={cur:null,answered:false,picked:null,soon:[],recent:[],count:0};
  if(S.cur!=null&&!S.answered&&pool().includes(S.cur)){renderCard();return}
  next()}
function next(){S.answered=false;S.picked=null;S.cur=pickNext();
  if(S.cur==null){S=null;save();renderHome();return}
  S.recent=[S.cur,...S.recent.filter(v=>v!==S.cur)].slice(0,Math.min(8,Math.floor(pool().length/2)));
  save();renderCard();window.scrollTo(0,0)}
function pick(i){if(S.answered)return;S.answered=true;S.picked=i;const q=Q[S.cur];const h=H[S.cur]||{n:0,w:0};const s=score(S.cur);
  h.n++;h.ok=i===q.a;if(!h.ok)h.w++;h.s=h.ok?Math.min(5,Math.max(1,s)+1):1;h.ts=Date.now();H[S.cur]=h;
  if(!h.ok){S.soon=S.soon.filter(x=>x.i!==S.cur);S.soon.push({i:S.cur,at:S.count+4})}
  save(true);renderCard()}

function removeQ(i){if(!isX(i))X.push(i);if(S){S.soon=S.soon.filter(x=>x.i!==i)}armed=false;if(S&&S.cur===i){next()}else{save();renderHome()}}
function restoreQ(i){X=X.filter(v=>v!==i);save();renderHome()}
function renderHome(){
  view="home";
  const ids=pool(),m=mastery(ids);
  const seen=ids.filter(k=>H[k]).length,wrong=ids.filter(k=>score(k)===1).length;
  const cm={},cc={};Q.forEach((q,i)=>{if(inSet(i)){(cc[q.c]=cc[q.c]||[]).push(i)}});for(const c in cc)cm[c]=mastery(cc[c]);
  const live=S&&S.cur!=null&&!S.answered&&ids.includes(S.cur);
  const anyH=Object.keys(H).length;
  app.innerHTML=`<div class="wrap">
    <div class="eyebrow">Fine Vintage · Level 2 practice</div>
    <h1>WSET Level 2 Drills</h1>
    <p class="sub">Two question sets:</p>
    <ol class="sub" style="padding-left:20px;margin:6px 0 0"><li><b>Fine Vintage question bank</b>: all ${BANK} questions, replicated as written.</li><li><b>Additional generated questions (textbook based)</b>: ${GAP} questions covering your flashcard decks (plus tasting, viticulture, food pairing, winemaking and storage from the textbook), with every answer taken from the WSET textbook.</li></ol>
    <p class="sub">Every question has a score from 0 to 5. Get it wrong and it drops to 1 and comes back a few cards later; get it right and it goes up one. Low scores come up often, 5s only now and then. Mastery is your average score.</p>
    <div class="sec"><div class="eyebrow">Question set</div></div>
    <div class="chips">${[["all","Both",LIVE],["bank","1. Fine Vintage question bank",BANK],["gap","2. Additional generated questions (textbook based)",GAP]].map(([k,v,c])=>`<button class="chip setb" data-s="${k}" aria-pressed="${home.set===k}"><span class="box">${home.set===k?"✓":""}</span><span class="nm">${v}</span><span class="ct">${c}</span></button>`).join("")}</div>
    <div class="stats"><div class="stat"><b>${m}%</b><span>mastery</span></div><div class="stat"><b>${seen}/${ids.length}</b><span>answered</span></div><div class="stat"><b>${wrong}</b><span>wrong last time</span></div></div>
    <div class="bar" style="margin:4px 0 2px"><i style="width:${m}%"></i></div>
    <p class="sub syncline" style="font-size:.85rem">${syncText()}</p>
    <div class="sec"><div class="eyebrow">Chapters · questions · mastery</div><div><button class="link" id="all">All</button> · <button class="link" id="none">None</button></div></div>
    <div class="chips">${Object.entries(CH).map(([k,v])=>`<button class="chip" data-c="${k}" aria-pressed="${home.sel.has(+k)}"><span class="box">${home.sel.has(+k)?"✓":""}</span><span class="nm">${k}. ${esc(v)}</span><span class="ct">${(cc[k]||[]).length} · ${cm[k]||0}%</span></button>`).join("")}</div>
    ${X.length?`<div class="sec"><div class="eyebrow">Removed questions (${X.length})</div><div><button class="link" id="restoreall">${armed==="restore"?"Tap again to restore all":"Restore all"}</button></div></div><div class="miss">${X.slice().sort((a,b)=>a-b).map(i=>`<div class="mi rm"><div class="n">${Q[i].x?`A${i+1-BANK}`:`Q${i+1}`} · ${esc(CH[Q[i].c])}</div><div>${esc(Q[i].q)}</div><button class="link rq" data-i="${i}">Put back in the drill</button></div>`).join("")}</div>`:""}
    ${anyH?`<div style="margin-top:18px"><button class="link" id="wipe">${armed==="wipe"?"Tap again to set every score back to 0":"Reset all scores"}</button></div>`:""}
  </div>
  <div class="dock"><div class="in"><button class="btn" id="go" ${ids.length?"":"disabled"}>${live?"Continue studying":"Study"} · ${ids.length} questions</button></div></div>`;
  app.querySelectorAll(".setb").forEach(b=>b.onclick=()=>{home.set=b.dataset.s;save();renderHome()});
  app.querySelectorAll(".chip:not(.setb)").forEach(b=>b.onclick=()=>{const c=+b.dataset.c;home.sel.has(c)?home.sel.delete(c):home.sel.add(c);save();renderHome()});
  app.querySelector("#all").onclick=()=>{home.sel=new Set(Object.keys(CH).map(Number));save();renderHome()};
  app.querySelector("#none").onclick=()=>{home.sel.clear();save();renderHome()};
  app.querySelector("#go").onclick=()=>{armed=false;study()};
  app.querySelectorAll(".rq").forEach(b=>b.onclick=()=>restoreQ(+b.dataset.i));
  const ra=app.querySelector("#restoreall");if(ra)ra.onclick=()=>{if(armed!=="restore"){armed="restore";renderHome();return}armed=false;X=[];save();renderHome()};
  const w=app.querySelector("#wipe");if(w)w.onclick=()=>{if(armed!=="wipe"){armed="wipe";renderHome();return}armed=false;R=Date.now();H={};S=null;save(true);renderHome()};
}

function optOrder(q){if(!S.perm||S.permFor!==S.cur||S.perm.length!==q.o.length){const pin=q.o.map((_,i)=>i).filter(i=>/\b(all|none) of the above/i.test(q.o[i])),a=q.o.map((_,i)=>i).filter(i=>!pin.includes(i));for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}a.push(...pin);S.perm=a;S.permFor=S.cur}return S.perm}
function renderCard(){
  view="renderCard";
  const q=Q[S.cur],ids=pool(),m=mastery(ids),s=score(S.cur);
  const ok=S.answered&&S.picked===q.a;
  const ord=optOrder(q);
  app.innerHTML=`<div class="wrap${S.answered?" answ":""}" style="padding-top:4px">
    <div class="top"><button class="back" id="back" aria-label="Back to chapters">←</button>
      <div class="prog"><div class="bar"><i style="width:${m}%"></i></div><div class="meta"><span>Mastery ${m}%</span><span>This question: ${s}/5</span></div></div></div>
    <div class="card${S.answered?" ans":""}">
      <div class="tags"><span class="eyebrow">${q.x?`A${S.cur+1-BANK}`:`Q${S.cur+1}`} · ${esc(CH[q.c])}</span>${q.x&&!S.answered?`<span class="tag">Additional generated questions (textbook based)</span>`:""}</div>
      <h2 class="q">${esc(q.q)}</h2>
      ${q.h?`<p class="sub" style="margin-top:8px;font-size:.85rem;font-weight:600">${q.h.map(esc).join(" · ")}</p>`:""}
      ${q.s?`<ol class="stmts">${q.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
      <div class="opts">${ord.map((i,pos)=>{const o=q.o[i];let c="";if(S.answered){if(i===q.a)c="right";else if(i===S.picked)c="wrong";else c="dim"}return `<button class="opt ${c}" data-i="${i}" ${S.answered?"disabled":""}><span class="l">${L[pos]}</span><span class="t">${esc(o)}${S.answered?(i===q.a?bq(S.cur,i):`<span class="why">${esc((N[S.cur]||[])[i]||"")}</span>${i===S.picked&&!sameQ(S.cur,i,q.a)?bq(S.cur,i):""}`):""}</span></button>`}).join("")}</div>
      ${S.answered?`<div class="fb ${ok?"ok":"no"}" role="status"><h3>${ok?"Correct":"Not quite"}<span class="later2"> · score ${s}/5${ok?"":", comes back in a few cards"}</span></h3><p>${esc(q.e)}</p>${M[S.cur]?`<p class="mem"><b class="lb2">Remember it:</b> ${esc(M[S.cur])}</p>`:""}</div>`:""}
      ${S.answered?`<p style="margin:10px 0 0"><button class="link" id="rmq" style="font-size:.85em">${armed==="rm"?"Tap again to remove it from your drill":"Not important? Remove this question"}</button></p>`:""}
      <p class="sub syncline" style="font-size:.78rem;margin-top:14px">${syncText()}</p>
      <p class="kbd">Keys: 1–4 (or a–d) to answer, Space or Enter for next.</p>
    </div></div>
    ${S.answered?`<div class="dock tight"><div class="in"><button class="btn" id="next">Next question</button></div></div>`:""}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  app.querySelector("#back").onclick=()=>{armed=false;renderHome()};
  const n=app.querySelector("#next");if(n){n.onclick=()=>{armed=false;next()};n.focus({preventScroll:true})}
  const rm=app.querySelector("#rmq");if(rm)rm.onclick=()=>{if(armed!=="rm"){armed="rm";renderCard();return}removeQ(S.cur)};
  if(S.answered){window.scrollTo(0,0);fitCard()}
}

function sameQ(qi,i,a){const b=BQ[qi]||[];return !!(b[i]&&b[a]&&b[i][0]===b[a][0])}
function bq(qi,i){const r=(BQ[qi]||[])[i];if(!r)return "";const pg=r.slice(1);return `<span class="bq">“${esc(QT[r[0]])}”<span class="pg">WSET L2 textbook, ${pg.length>1?"pp. "+pg.join(", "):"p. "+pg[0]}</span></span>`}
function fitCard(){
  const c=app.querySelector(".card"),d=app.querySelector(".dock"),fb=app.querySelector(".fb");if(!c)return;
  let f=16;c.style.fontSize=f+"px";
  const avail=()=>window.innerHeight-(d?d.offsetHeight:0)-6;
  const end=()=>(fb||c).getBoundingClientRect().bottom;
  while(f>11&&end()>avail()){f-=.5;c.style.fontSize=f+"px"}
}
window.addEventListener("resize",()=>{if(view==="renderCard"&&S&&S.answered)fitCard()});

document.addEventListener("keydown",e=>{
  if(!S||S.cur==null||view!=="renderCard")return;
  if(e.key===" "&&!S.answered){e.preventDefault();return}
  const k=e.key.toLowerCase();
  if(!S.answered){let i="abcd".indexOf(k);if(i<0)i="1234".indexOf(k);if(i>=0&&i<Q[S.cur].o.length)pick(optOrder(Q[S.cur])[i])}
  else if(k==="enter"||k===" "){e.preventDefault();armed=false;next()}
});
load();renderHome();initCloud();
</script>
