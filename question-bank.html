{"c":4,"q":"Heavy rain close to harvest can cause:","o":["Higher sugar levels in the grapes","Better, riper tannins in the skins","Grapes to raisin and shrivel on the vine","Grapes to swell, diluting their flavours"],"a":3,"e":"High moisture helps fungal diseases spread, and heavy rain near harvest makes grapes swell and dilutes their flavour.","x":1},
{"c":4,"q":"Why is frost a particular risk in spring?","o":["It can kill the vine's new growth, reducing the crop","It concentrates the sugars in the young grapes","It splits the ripe grapes just before harvest","It spreads fungal disease through the vineyard"],"a":0,"e":"Spring frost can kill new shoots, which reduces how many grapes the vine can grow that year.","x":1},
{"c":4,"q":"In a hot, dry vintage, why might a vine fail to ripen its grapes?","o":["The grapes freeze on the vine overnight","The acid levels in the grapes rise too high","Botrytis spreads through the vineyard","Short of water, the vine shuts down"],"a":3,"e":"Heat increases the vine's need for water, but heat usually comes with little rain. Without water the vine shuts down and the grapes don't ripen. Grapes can also get dried-fruit aromas and sunburn.","x":1},
{"c":4,"q":"Pesticides are used in the vineyard to:","o":["Kill weeds","Keep birds away","Kill fungi","Kill insects"],"a":3,"e":"Fungicides kill fungi, pesticides kill insects and herbicides control weeds.","x":1},
{"c":4,"q":"Which statement about organic vineyards is true?","o":["Irrigation is banned, so vines rely only on rain","They must be hand-harvested and fermented in oak","No sprays of any kind are allowed in the vineyard","No synthetic chemicals, but some sprays are allowed"],"a":3,"e":"Organic means no synthetic chemicals, but some sprays are still allowed to control the worst fungal diseases.","x":1},
{"c":4,"q":"If a vine's yield is too high, the grapes are likely to have:","o":["Diluted flavours and lower sugar levels","More concentrated flavours and higher sugar","Higher acidity and riper tannins","More botrytis and deeper colour"],"a":0,"e":"Too many grapes means diluted flavour and less sugar; too few and the crop isn't commercially viable.","x":1},
{"c":4,"q":"Why can't machine harvesters be used in some vineyards?","o":["They only work at night","They're banned in the EU","They can't be used on steep slopes","They can't pick grapes for quality wine"],"a":2,"e":"Hand and machine harvesting are equally capable of quality. The choice depends on the style, but machines can't work steep slopes.","x":1},
{"c":4,"q":"How do Geographical Indications (GIs) outside the EU differ from those inside it?","o":["Outside the EU they mainly show where the grapes were grown","Outside the EU they dictate which grape varieties are allowed","There is no real difference between the two systems","Outside the EU they only cover single named vineyards"],"a":0,"e":"Inside the EU, GIs come with rules on grapes and winemaking, so they predict style. Outside, growers are free, so you need other clues like the grape variety.","x":1},
{"c":4,"q":"Compared with PDOs, PGIs typically:","o":["Exist only in France","Cover smaller areas with tighter rules","Cover a wider area with less strict regulations","Can only make inexpensive wine"],"a":2,"e":"PDOs are typically small and tightly regulated. PGIs are larger and more flexible, from high-volume wines to outstanding premium ones.","x":1},
{"c":4,"q":"Which is the Protected Geographical Indication (PGI) labelling term in Italy?","o":["Denominación de Origen Calificada (DOCa)","Denominazione di Origine Controllata e Garantita (DOCG)","Denominazione di Origine Controllata (DOC)","Indicazione Geografica Tipica (IGT)"],"a":3,"e":"Italy: DOC and DOCG are PDO; IGT is PGI.","x":1},
{"c":4,"q":"Which of the following is a PDO labelling term in Spain?","o":["Denominación de Origen Calificada (DOCa)","Indication géographique protégée (IGP)","Landwein","Vino de la Tierra"],"a":0,"e":"Spain: DO and DOCa are PDO; Vino de la Tierra is PGI.","x":1},
{"c":4,"q":"Which of the following are French PGI labelling terms?","o":["IGP and Vin de pays (VdP)","AOP and AOC","IGT and Vino de la Tierra","Qualitätswein and Landwein"],"a":0,"e":"France: AOP and AOC are PDO; IGP and Vin de pays are PGI.","x":1},
{"c":4,"q":"What does 'vieilles vignes' on a French label indicate?","o":["A grand cru vineyard, by law","Grapes grown organically, by law","Old vines, but not legally defined","Vines over 100 years old, by law"],"a":2,"e":"Old vines give smaller crops of more concentrated grapes, so the term is prized. But it isn't legally defined, so its use can be disputed.","x":1},
{"c":4,"q":"An Australian wine and a Californian wine are both labelled 2016. Which is true?","o":["The Californian wine is about half a year older","The vintage refers to the bottling year","They are exactly the same age","The Australian wine is about half a year older"],"a":3,"e":"The vintage is the harvest year. Southern-hemisphere grapes are harvested around half a year before northern ones in the same calendar year.","x":1},
{"c":4,"q":"How is Icewine/Eiswein made?","o":["Grapes are picked and frozen in the winery, then pressed","Grapes are picked and dried indoors, then pressed","Grapes are affected by noble rot, then frozen and pressed","Healthy grapes freeze on the vine and are pressed still frozen"],"a":3,"e":"Pressing frozen grapes leaves the ice behind, so the small amount of juice has highly concentrated sugar, acid and flavour.","x":1},
{"c":5,"q":"During alcoholic fermentation, yeast convert sugar into:","o":["Tannin and alcohol, giving off heat","Acid and carbon dioxide, giving off heat","Alcohol and carbon dioxide, giving off heat","Alcohol and oxygen, giving off heat"],"a":2,"e":"Yeast feed on sugar and produce alcohol, carbon dioxide (which escapes) and heat.","x":1},
{"c":5,"q":"Alcohol levels in most dry wines fall between:","o":["5% and 8% abv","9% and 10.5% abv","11.5% and 16% abv","17% and 20% abv"],"a":2,"e":"Fermentation usually stops when all the sugar is gone, giving a dry wine of 11.5–16% abv depending on how ripe the grapes were.","x":1},
{"c":5,"q":"In red winemaking, what is the 'cap'?","o":["A layer of grape skins floating on top of the fermenting juice","The crown cap used to seal bottles of sparkling wine","The layer of dead yeast that settles at the bottom of the tank","The lid used to close the top of the fermentation tank"],"a":0,"e":"The skins float up and form the cap. Left alone, no colour or tannin can be extracted from it, so it must be mixed back in.","x":1},
{"c":5,"q":"In red winemaking, 'punching down' involves:","o":["Pressing the skins after fermentation","Lowering the fermentation temperature","Pumping juice from the bottom of the vessel over the cap","Using a plunger to push the cap down into the liquid"],"a":3,"e":"Punching down and pumping over are the two most common ways to mix skins with the fermenting liquid and extract colour and tannin.","x":1},
{"c":5,"q":"How is a rosé made by short maceration?","o":["White grapes are left on their skins for several weeks, then pressed","Black grapes ferment on their skins, then are drained after a few hours","Black grapes are pressed very gently and the juice never touches the skins","Finished red wine and white wine are blended together before bottling"],"a":1,"e":"Short maceration starts like red winemaking, but the juice comes off the skins after a few hours and finishes fermenting cool, like a white.","x":1},
{"c":5,"q":"Which method of making rosé is not permitted in many parts of Europe?","o":["Using black grapes","Blending red wine with white wine","Short maceration","Fermenting in stainless steel"],"a":1,"e":"A rosé can be made by blending red and white wine, but that isn't allowed in many parts of Europe.","x":1},
{"c":5,"q":"Can white wine be made from black grapes?","o":["Only if the colour is removed afterwards with filters","No, black grapes always give red or rosé wine","Yes, if the grapes are pressed very gently","Only when making sweet or fortified wines"],"a":2,"e":"With very few exceptions, the pulp of black grapes is pale, so gentle pressing gives white juice.","x":1},
{"c":5,"q":"Fortification kills the yeast by raising the alcohol to around:","o":["15–20% abv","8–10% abv","11.5–13% abv","25–30% abv"],"a":0,"e":"Adding alcohol to fermenting juice lifts it to 15–20% abv, which kills the yeast before all the sugar is fermented. Port is made this way.","x":1},
{"c":5,"q":"Which sweet-winemaking technique lets the winemaker control the level of sweetness most precisely?","o":["Using botrytis-affected grapes","Using frozen grapes","Adding sweetness to a dry wine","Removing the yeast with filters"],"a":2,"e":"Adding unfermented or concentrated grape juice, or blending in a sweet wine, lets the winemaker dial in exactly the sweetness they want.","x":1},
{"c":5,"q":"In a cool vintage, the grapes have too little sugar. What can the winemaker do?","o":["Ferment the juice at a lower temperature","Add sugar to the juice to raise the alcohol","Neutralise some of the sugar in the juice","Add acid to the juice to balance it"],"a":1,"e":"Low-sugar grapes make wines low in alcohol and body. Adding sugar to the juice gives more alcohol. In warm climates, winemakers add acid; in cool climates they may also neutralise excess acid.","x":1},
{"c":5,"q":"Fermenting a white wine at the lower end of the 12–22°C range tends to:","o":["Create buttery, creamy aromas","Add oak flavours of vanilla and toast","Extract more tannin from the skins","Produce notable fruity aromas"],"a":3,"e":"At the cooler end of the white-wine range, fermentations can produce notably fruity aromas.","x":1},
{"c":5,"q":"Which statement about stainless steel and concrete vessels is true?","o":["They add flavours of vanilla and smoke to the wine","They let small amounts of oxygen interact with the wine","They can only be used for fermentation, never storage","They are inert, add no flavour and can be made airtight"],"a":3,"e":"Inert vessels add no flavour and can keep oxygen out, so the wine's flavours don't change.","x":1},
{"c":5,"q":"The level of 'toasting' of an oak barrel can produce:","o":["Sweet-spice and charred-wood aromas","Butter and fresh cream aromas","Bread dough and biscuit aromas","Honey, petrol and nut aromas"],"a":0,"e":"Staves are heated to bend them. How long and how hot affects the oak flavours: toasting gives sweet spice and charred wood.","x":1},
{"c":5,"q":"After how many uses does an oak barrel have very little flavour left to give?","o":["Barrels never lose their flavour","One","Two or three","Ten"],"a":2,"e":"New-oak barrels give the most flavour (vanilla, coconut, charred wood, spice). Each use gives less, and after two or three there's very little left.","x":1},
{"c":5,"q":"Oxygen entering an oak barrel during maturation can:","o":["1 and 2 only","1 and 3 only","1, 2 and 3","2 and 3 only"],"a":0,"e":"Oak is watertight but not airtight. Oxygen develops caramel, dried-fruit and nut flavours and softens red-wine tannins, faster in small barrels than large vessels.","x":1,"s":["Develop flavours of caramel, dried fruit and nuts","Soften the tannins in red wine","Add buttery flavours"]},
{"c":5,"q":"The interaction between wine and oxygen in oak happens more quickly in:","o":["Large oak vessels","Small barrels","Stainless steel tanks","Concrete vessels"],"a":1,"e":"More of the wine's surface touches the wood in a small barrel. Large oak vessels are rarely used to add oak flavour.","x":1},
{"c":5,"q":"Why might a winemaker use oak chips or staves instead of barrels?","o":["They are a cheaper way to give oak flavour to less expensive wines","They are required by law for premium wines in most of Europe","They let much more oxygen into the wine than barrels do","They add buttery, creamy flavours to the finished wine"],"a":0,"e":"Barrels are expensive. Chips or staves added to wine in an inert vessel give oak flavour at much lower cost.","x":1},
{"c":5,"q":"Malolactic conversion is carried out by:","o":["Oxygen","Bacteria","Oak","Yeast"],"a":1,"e":"Malolactic conversion happens after alcoholic fermentation. Bacteria lower the acidity and can give buttery flavours. It nearly always happens in reds.","x":1},
{"c":5,"q":"Winemakers often prevent malolactic conversion and avoid lees stirring when making wine from which type of grape?","o":["Chardonnay, for a fuller style","Black grapes for full-bodied red wine","Grapes destined for oaked white wines","Aromatic varieties such as Riesling"],"a":3,"e":"Malo lowers acidity and adds butter; lees add bread and biscuit. Both are usually avoided for aromatic varieties to keep their acidity and aromas pure.","x":1},
{"c":5,"q":"Why do winemakers blend wines?","o":["1 and 2 only","1 only","1, 2 and 3","2 and 3 only"],"a":0,"e":"Blending keeps a brand tasting the same year after year and can create a wine more complex than its parts.","x":1,"s":["To keep a brand's style consistent from year to year","To create a more complex wine","To raise the alcohol level"]},
{"c":5,"q":"As a white wine matures in bottle, its colour typically:","o":["Moves from gold to lemon and becomes paler","Turns ruby","Moves from lemon to gold to amber and becomes deeper","Stays the same"],"a":2,"e":"Whites deepen with age, lemon → gold → amber, and develop dried apricot, honey, nut and spice.","x":1},
{"c":5,"q":"As a red wine matures in bottle, its colour typically:","o":["Turns gold","Moves from garnet to ruby and becomes deeper","Moves from ruby to garnet to tawny and becomes paler","Moves from purple to ruby and becomes deeper"],"a":2,"e":"Reds lighten with age, ruby → garnet → tawny. Tannins drop and soften, and deposits can form.","x":1},
{"c":5,"q":"Which tertiary characteristics can develop in a red wine aged in bottle?","o":["Butter and cream","Vanilla, smoke and coconut","Apple, lemon and grass","Fig, prune, meat and wet leaves"],"a":3,"e":"Bottle-aged reds develop fig, prune, meat and wet leaves; whites develop dried apricot, honey, nut and spice.","x":1},
{"c":5,"q":"Which statement about maturation in the bottle is true?","o":["Most wines do not improve in bottle; their fruit fades","All wines improve with at least five years in bottle","Sweet wines can never age","Only low-acid wines improve in bottle"],"a":0,"e":"Most wines don't improve. The few that do need concentrated flavour plus high acidity, high sugar (sweet wines) or high tannin (reds).","x":1},
{"c":6,"q":"Which statement about Pinot Noir in the vineyard is true?","o":["It is thin-skinned and prone to rot and disease","It needs a warm climate","It is thick-skinned and disease-resistant","It is easy to grow in any vintage"],"a":0,"e":"Pinot Noir is thin-skinned, prone to rot and disease, and not easy to grow. It needs a cool to moderate climate.","x":1},
{"c":6,"q":"Which best describes a typical Pinot Noir?","o":["Deep · Medium · High","Pale · Low · High","Pale to medium · High · Low to medium","Deep · Low · Medium to high"],"a":2,"e":"Pale to medium colour, high acidity, low to medium tannin, red fruit (strawberry, raspberry, red cherry).","x":1,"h":["Colour","Acidity","Tannin"]},
{"c":6,"q":"Why are older and/or larger barrels often used for Pinot Noir?","o":["They add more tannin to support its delicate fruit","Small new-oak barrels can overwhelm its delicate fruit","They give stronger vanilla flavours, which suit Pinot Noir","Pinot Noir is never oaked, so barrels are rarely used"],"a":1,"e":"Older or larger barrels add less flavour. The best Pinot Noirs show subtle oak (smoke, cloves) balanced by fruit.","x":1},
{"c":6,"q":"What tertiary flavours can very good or outstanding Pinot Noir develop in bottle?","o":["Petrol and honey","Forest floor and mushroom","Leather and coffee","Butter and cream"],"a":1,"e":"Fine Pinot Noir gains forest floor and mushroom with bottle age and may take several years to show its best.","x":1},
{"c":6,"q":"The Côte d'Or in Burgundy is split into two halves. Which is the northern half?","o":["Chablis","Côte de Beaune","Mâconnais","Côte de Nuits"],"a":3,"e":"Côte de Nuits is north (Gevrey-Chambertin, Nuits-Saint-Georges); Côte de Beaune is south (Beaune, Pommard).","x":1},
{"c":6,"q":"Which of these Pinot Noir villages is in the Côte de Beaune?","o":["Pommard AOC","Gevrey-Chambertin AOC","Pouilly-Fuissé AOC","Nuits-Saint-Georges AOC"],"a":0,"e":"Côte de Beaune: Beaune and Pommard. Côte de Nuits: Gevrey-Chambertin and Nuits-Saint-Georges.","x":1},
{"c":6,"q":"What is the order of the Burgundy hierarchy, from lowest to highest?","o":["Bourgogne AOC, premier cru, village, grand cru","Bourgogne AOC, village, premier cru, grand cru","Village, Bourgogne AOC, grand cru, premier cru","Grand cru, premier cru, village, Bourgogne AOC"],"a":1,"e":"Regional (Bourgogne AOC) → village → premier cru vineyards → grand cru vineyards.","x":1},
{"c":6,"q":"A typical red Bourgogne AOC is best described as:","o":["Inexpensive, because Burgundy has little demand","Sweet, low in alcohol and made for dessert","Full-bodied, cooked black fruit, long ageing","Light to medium body, fresh red fruit, drink young"],"a":3,"e":"Bourgogne AOC lacks the flavour intensity to age. Due to demand, even basic Bourgogne can be expensive.","x":1},
{"c":6,"q":"What cools Pinot Noir vineyards in Carneros, California?","o":["Cooling breezes from the Southern Ocean","Morning fogs from San Pablo Bay","Pacific Ocean breezes","Altitude"],"a":1,"e":"Carneros: San Pablo Bay fog. Western Sonoma: Pacific breezes. Santa Barbara County: sea breezes from the west and south.","x":1},
{"c":6,"q":"Which New Zealand region produces the country's ripest and most powerfully flavoured Pinot Noir?","o":["Central Otago","Hawke's Bay","Marlborough","Martinborough"],"a":0,"e":"Despite its southerly latitude, Central Otago is ringed by mountains that block sea breezes and rain, giving intensely sunny days and cool nights.","x":1},
{"c":6,"q":"Besides the Yarra Valley, which Australian region is cool enough for Pinot Noir thanks to Southern Ocean breezes?","o":["Clare Valley","Barossa Valley","Mornington Peninsula","Hunter Valley"],"a":2,"e":"Yarra Valley and Mornington Peninsula in Victoria are among the few Australian regions cool enough for Pinot Noir.","x":1},
{"c":6,"q":"Compared with California, Oregon's climate is generally:","o":["Warmer and drier, ideal for Cabernet","Cooler, and mostly moderate, ideal for Pinot Noir","Hot and continental, ideal for Zinfandel","Too cold for any black grapes to ripen"],"a":1,"e":"Oregon's best Pinot Noirs have fresh red fruit, subtle oak (smoke, cloves) and develop earth and mushroom with age.","x":1},
{"c":7,"q":"As Zinfandel/Primitivo grapes ripen, their flavours change from:","o":["Black fruits to red fruits","Green fruit to tropical fruit","Red fruits to black fruits","Citrus to stone fruit"],"a":2,"e":"Zinfandel moves from strawberry and raspberry to plum and black cherry as it ripens.","x":1,"z":1},
{"c":7,"q":"Some Zinfandel grapes in a bunch start to raisin before others have ripened. What does this give the wine?","o":["High sugar levels and dried-fruit flavours","Botrytis character and honeyed flavours","Low alcohol and light, delicate flavours","High acidity and green, herbaceous flavours"],"a":0,"e":"Uneven ripening gives high sugar and flavours of prune and raisin.","x":1},
{"c":7,"q":"White Zinfandel typically has what level of alcohol?","o":["High, 15% abv and above","Low, typically 8–10% abv","Medium, 12–13% abv","Fortified, 17% abv"],"a":1,"e":"White Zinfandel is usually made by short maceration, and removing the yeasts before fermentation finishes leaves medium sweetness and only 8–10% abv.","x":1},
{"c":7,"q":"Which best describes a typical Californian red Zinfandel?","o":["Medium · High · Low","Low · Low · Low","High · Low · Medium","Medium to high · Medium to high · High"],"a":3,"e":"Dry, medium to high acidity and tannin, high alcohol and full body, with black fruit, dried fruit and oak.","x":1,"h":["Acidity","Tannin","Alcohol"]},
{"c":7,"q":"Puglia's Primitivo is an important source of:","o":["Soft, fruity, dry red wine for high-volume brands","Medium-sweet, pale rosé for high-volume brands","Traditional-method sparkling wine for export","Sweet, fortified red wine aged in oak"],"a":0,"e":"Warm Puglia makes lots of soft, fruity, dry reds. From controlled yields, top Primitivos can be very good or outstanding and great value.","x":1,"z":1},
{"c":8,"q":"Extra-ripe Riesling grapes give flavours of:","o":["Grass and green bell pepper","Stone fruit and tropical fruit","Apple, lemon and lime","Blackcurrant and mint"],"a":1,"e":"Just-ripe: green fruit and citrus. Extra-ripe: peach, apricot, mango, pineapple, and sometimes dried fruit.","x":1},
{"c":8,"q":"Off-dry or medium Riesling can be made by adding Süssreserve. What is it?","o":["Grape spirit","Botrytis-affected grapes","Sugar from beet","Sterile grape juice"],"a":3,"e":"Off-dry and medium Rieslings are made by removing yeast to stop fermentation, or by adding sterile grape juice (Süssreserve).","x":1},
{"c":8,"q":"Why is Riesling typically fermented in stainless steel?","o":["To add vanilla and toast","To preserve its floral aromas","To soften tannins","To add body"],"a":1,"e":"Inert vessels keep Riesling's floral, fruity aromas pure.","x":1},
{"c":8,"q":"Compared with Mosel Rieslings, Rheingau Rieslings are typically:","o":["Sweeter and lighter","Made from botrytised grapes only","Drier in style with more body","Always sparkling"],"a":2,"e":"Rheingau vineyards are on steep south-facing slopes on the north bank of the Rhine. The wines are drier and fuller than Mosel's.","x":1},
{"c":8,"q":"A typical Riesling from the Pfalz is:","o":["Always labelled Eiswein","Full-bodied and oaked","Dry and medium-bodied","Sweet and light-bodied"],"a":2,"e":"Protected by mountains to the west, the Pfalz is dry and sunny, like an extension of Alsace, and its Rieslings are similar: dry and medium-bodied.","x":1},
{"c":8,"q":"Which mountains protect Alsace from rain-bearing westerly winds?","o":["The Alps","The Vosges Mountains","The Andes","The Apennines"],"a":1,"e":"The Vosges make Alsace one of the driest, sunniest regions in France. The best vineyards face east or south-east in the foothills.","x":1},
{"c":8,"q":"A typical Alsace Riesling is:","o":["Full-bodied, low in acidity and off-dry","Oaked, with vanilla, toast and butter notes","Sweet, light-bodied and low in alcohol","Dry, medium-bodied and high in acidity"],"a":3,"e":"Alsace Riesling is dry with ripe citrus and stone fruit and blossom. The best come from grand cru vineyards and age into honey and dried fruit.","x":1},
{"c":8,"q":"What is the PGI labelling term in Germany?","o":["Qualitätswein","Prädikatswein","Kabinett","Landwein"],"a":3,"e":"Germany: Qualitätswein and Prädikatswein are PDO; Landwein is PGI and typically light, dry to off-dry.","x":1},
{"c":8,"q":"A wine labelled Qualitätswein must:","o":["Come from one of Germany's 13 wine regions","Come from a single named vineyard site","Be sweet, with some residual sugar left","Be made from grapes affected by botrytis"],"a":0,"e":"Qualitätswein comes from one of 13 regions and needs riper grapes than Landwein. Prädikatswein needs even riper grapes from a single region.","x":1},
{"c":8,"q":"Which Prädikat wine is made from grapes frozen on the vine, with no botrytis involved?","o":["Trockenbeerenauslese","Auslese","Beerenauslese","Eiswein"],"a":3,"e":"Eiswein grapes are concentrated by freezing. BA and TBA are concentrated by botrytis.","x":1},
{"c":8,"q":"Which Prädikat category is made from individually selected berries that have been 'dried' by botrytis?","o":["Spätlese (late harvest)","Beerenauslese (BA)","Auslese (selected harvest)","Trockenbeerenauslese (TBA)"],"a":3,"e":"Trocken = dry, beeren = berries, auslese = selected. TBA is rarer and more concentrated than BA.","x":1},
{"c":8,"q":"A dry Auslese compared with a dry Kabinett will typically be:","o":["Sweeter","Exactly the same","Higher in alcohol","Lower in alcohol"],"a":2,"e":"Auslese grapes have more sugar, so fermented to dryness they give more alcohol than Spätlese, which in turn has more than Kabinett.","x":1},
{"c":8,"q":"On a German label, 'Halbtrocken' indicates:","o":["A dry wine","A wine with some sweetness","A late-harvest wine","A wine from selected berries"],"a":1,"e":"Trocken = dry. Halbtrocken = half-dry, i.e. some sweetness.","x":1},
{"c":8,"q":"Why do Eden Valley and Clare Valley have moderate climates when the nearby Barossa Valley is warm?","o":["Their southerly latitude","Their higher altitude","Fog from the coast","Cold ocean currents"],"a":1,"e":"Altitude cools Eden and Clare Valleys. Their Rieslings are dry with pronounced lime, peach, blossom and petrol.","x":1},
{"c":9,"q":"An off-dry or medium Vouvray is labelled:","o":["Brut","Halbtrocken","Trocken","Demi-Sec"],"a":3,"e":"Vouvray makes dry, off-dry, medium, sweet and sparkling Chenin Blanc. Off-dry or medium styles say Demi-Sec.","x":1},
{"c":9,"q":"Which statement about Vouvray AOC is true?","o":["Only dry wines are allowed, and they are typically unoaked","Wines range from dry to sweet and sparkling, typically unoaked","It is a blend of Chenin Blanc and Chardonnay, often oaked","The wines are usually heavily oaked and made only dry"],"a":1,"e":"Vouvray is 100% Chenin Blanc in every style, kept unoaked, and the best age into honey and dried fruit.","x":1},
{"c":9,"q":"Why is Chenin Blanc prized in South Africa?","o":["It's always blended with Pinotage","Its ability to keep high acidity in a warm climate","It's the only grape that resists botrytis","It needs a cool climate"],"a":1,"e":"Chenin keeps its acidity in warm conditions. Inexpensive versions use warm inland grapes, often blended with Chardonnay.","x":1},
{"c":9,"q":"Very good South African Chenin Blanc from old vines typically shows:","o":["Light green apple and lemon, with no oak","Pronounced tropical fruit with smoke and vanilla","Black fruit and pepper with firm tannins","Bread and biscuit from long lees ageing"],"a":1,"e":"Low-yielding old vines give concentrated pineapple and mango, often with smoke and vanilla from oak.","x":1},
{"c":9,"q":"What are the primary flavours of a young Semillon?","o":["Lychee and rose","Honey and nuts","Blackcurrant and mint","Apple, lemon and grass"],"a":3,"e":"Young Semillon has simple apple, lemon and grass. With age, some develop dried fruit, nuts and honey.","x":1},
{"c":9,"q":"What does Sémillon add to a Bordeaux blend with Sauvignon Blanc?","o":["Bubbles and freshness","Herbaceous, grassy aromas","Tannin and deeper colour","Body and ageing potential"],"a":3,"e":"Sémillon gives Bordeaux's dry and sweet white blends more body and ageing potential.","x":1},
{"c":9,"q":"A typical Hunter Valley Semillon is:","o":["Sparkling, with high acidity and citrus","Sweet and botrytised, with honey and apricot","Full-bodied and oaked, with tropical fruit","Dry, light-bodied, low alcohol, ages to honey and nuts"],"a":3,"e":"Grapes are picked early in this warm region for low sugar and high acid, made in inert vessels and bottled young. Bottle age brings honey and nuts.","x":1},
{"c":9,"q":"A typical Sauternes is:","o":["Dry, light-bodied and herbaceous, with high acidity","Off-dry and sparkling, with fresh citrus","Sweet, light-bodied and low in alcohol, with grape","Sweet, full-bodied, high acidity, with apricot and oak"],"a":3,"e":"Sauternes is made from botrytised grapes, mainly Sémillon. It ages into dried fruit, honey and caramel.","x":1},
{"c":9,"q":"A Tokaji Aszú labelled 6 Puttonyos, compared with one labelled 5 Puttonyos, is:","o":["Older","Lower in acidity","Drier","Sweeter"],"a":3,"e":"Tokaji Aszú is always sweet. 6 Puttonyos is sweeter than 5 Puttonyos.","x":1},
{"c":9,"q":"Why are Tokaji Aszú wines amber in colour?","o":["They're fortified with grape spirit","They're faulty and have oxidised","They're made from black grapes","They spend a long time ageing in oak"],"a":3,"e":"Long oak ageing gives amber colour and aromas of deliberate oxidation (caramel), alongside apricot, citrus, vanilla and smoke.","x":1,"z":1},
{"c":9,"q":"Which of these grapes have high acidity and are susceptible to botrytis?","o":["1 and 2 only","1 and 3 only","1, 2 and 3","2 and 3 only"],"a":0,"e":"Chenin Blanc and Furmint both have high acidity and are susceptible to botrytis, which suits sweet wines. Gewurztraminer is low to medium in acidity.","x":1,"s":["Chenin Blanc","Furmint","Gewurztraminer"]},
{"c":10,"q":"A typical cool-climate Chardonnay has:","o":["High acidity, light to medium body, green fruit, citrus and wet stones","Medium acidity, full body, peach, pineapple and banana","Low acidity, full body, lychee and rose","Medium to high acidity, medium to full body, lemon, peach and melon"],"a":0,"e":"Chardonnay changes with climate. Cool: green fruit, citrus, wet stones. Moderate: lemon, peach, melon. Warm: peach, pineapple, banana.","x":1},
{"c":10,"q":"A typical warm-climate Chardonnay is:","o":["Full-bodied and medium in acidity, with peach, pineapple and banana","Light-bodied and high in acidity, with apple and wet stones","Herbaceous, with grass and asparagus","Sweet, with honey and dried apricot"],"a":0,"e":"Warm-climate Chardonnay is full-bodied, medium in acidity and dominated by stone and tropical fruit.","x":1},
{"c":10,"q":"Why is acidification common for many warm-climate Chardonnays?","o":["Adding acid adds buttery flavours","Adding acid balances the alcohol and body","Adding acid gives oak flavours","Adding acid stops the fermentation"],"a":1,"e":"Warm-climate grapes lose acid as they ripen. Adding acid during winemaking keeps the wine balanced.","x":1},
{"c":10,"q":"What does malolactic conversion add to a Chardonnay?","o":["Bread and biscuit flavours, and more body","Hazelnut and mushroom flavours, with age","Butter and cream flavours, and softer acidity","Smoke, vanilla and coconut flavours"],"a":2,"e":"Malo adds butter and cream and softens harsh acids. Lees add body plus bread and biscuit. Oak adds smoke, vanilla and coconut. All are optional.","x":1},
{"c":10,"q":"What tertiary flavours can very good Chardonnay develop in bottle?","o":["Leather and meat","Butter and cream","Hazelnut and mushroom","Petrol and honey"],"a":2,"e":"Very good or outstanding Chardonnay can age for years or decades and gather hazelnut and mushroom.","x":1},
{"c":10,"q":"What does 'unoaked' or 'unwooded' on a Chardonnay label tell you?","o":["The wine had no malolactic conversion","The wine was made without oak treatment","The wine was fermented in old oak","The grapes came from young vines"],"a":1,"e":"Some producers avoid secondary flavours and use inert vessels. They may say 'unoaked' or 'unwooded' on the label.","x":1,"z":1},
{"c":10,"q":"Which is a key concern in Chablis that can limit how much wine is made each year?","o":["Hail","Excessive heat","Drought","Frost"],"a":3,"e":"Chablis is cool, so frost is the key risk. The best vineyards, Premier Cru and Grand Cru, face south/south-east on hillsides.","x":1},
{"c":10,"q":"Which two villages in the Côte de Beaune are famous for very good and outstanding Chardonnay?","o":["Gevrey-Chambertin and Nuits-Saint-Georges","Meursault and Puligny-Montrachet","Pomerol and Saint-Émilion","Sancerre and Pouilly-Fumé"],"a":1,"e":"Côte de Beaune Chardonnay gains complexity and body from oak and lees. Premier and grand crus can age for decades.","x":1},
{"c":10,"q":"A typical Mâcon AOC Chardonnay is:","o":["Fruity, mostly unoaked, with lemon, peach and melon","Light and lean, with green apple and wet stones","Sweet and botrytised, with honey and apricot","Full-bodied, new-oaked and age-worthy"],"a":0,"e":"The Mâconnais in southern Burgundy makes simple, fruity Mâcon AOC. Pouilly-Fuissé, on steep sun-trap slopes, is richer and often oaked.","x":1},
{"c":10,"q":"Most South of France Chardonnays are labelled:","o":["Grand Cru","Chablis AOC","IGP","DOC"],"a":2,"e":"The warm South of France makes high volumes of ripe Chardonnay (peach, pineapple, banana), mostly labelled IGP.","x":1},
{"c":10,"q":"High-volume Chardonnay from California's hot, irrigated Central Valley is typically labelled:","o":["Carneros","California","Sonoma","Napa Valley"],"a":1,"e":"These high-volume wines have no GI and are labelled 'California'. Any oak flavour usually comes from chips or staves.","x":1},
{"c":10,"q":"What cools Chardonnay vineyards in the Adelaide Hills?","o":["Ocean currents from the south","Cloud cover","Morning fogs","Altitude"],"a":3,"e":"Adelaide Hills is cooled by altitude; Yarra Valley by ocean currents from the south. Both give ripe stone fruit with medium to high acidity.","x":1},
{"c":10,"q":"In which New Zealand region is Chardonnay the most widely planted white grape?","o":["Central Otago","Martinborough","Hawke's Bay","Marlborough"],"a":2,"e":"Hawke's Bay, on the east coast of the North Island, is moderate. Its Chardonnay is full-bodied with high acidity and pronounced stone fruit.","x":1},
{"c":10,"q":"Which statement about Napa Valley Chardonnay is true?","o":["It is always unoaked, to keep its fresh fruit","It is the main source of California-labelled bulk wine","Napa gets cooler the further north you travel","It is full-bodied, tropical and oaky from new oak"],"a":3,"e":"Napa gets warmer and sunnier as you go north, and its Chardonnay is full-bodied and tropical with new-oak vanilla and spice.","x":1},
{"c":11,"q":"As Sauvignon Blanc grapes get riper, their flavours move from green fruit towards:","o":["Nuts and honey","Tropical fruit such as passion fruit","Black fruit such as blackberry","Dried fruit such as raisin"],"a":1,"e":"Sauvignon Blanc ranges from apple, gooseberry and wet stones to passion fruit, always with herbaceous and floral notes.","x":1},
{"c":11,"q":"How does a typical Sauvignon Blanc change after a couple of years in bottle?","o":["It turns slightly sparkling and loses colour","It develops honey and petrol, like Riesling","It keeps improving for a decade or more","It loses its freshness and can turn vegetal"],"a":3,"e":"Sauvignon Blanc is best young. Even outstanding examples can lose freshness within a couple of years of the vintage.","x":1},
{"c":11,"q":"Which term on a Sauvignon Blanc label suggests oak was used?","o":["Classico","Demi-Sec","Unwooded","Barrel aged"],"a":3,"e":"Most Sauvignon Blanc is made in inert vessels because new oak can overwhelm its herbaceous character. Oak use is usually flagged with terms like 'barrel aged'.","x":1},
{"c":11,"q":"Which statement about Sancerre AOC and Pouilly-Fumé AOC is true?","o":["They make mostly sweet, botrytised Sauvignon Blanc","They have a warm climate and make tropical, oaky wines","They are in Bordeaux and blend Sauvignon with Sémillon","They face each other across the Loire; whites must be Sauvignon"],"a":3,"e":"Both are cool Loire appellations making dry, high-acid Sauvignon Blanc with apple, grass, asparagus and sometimes wet stones.","x":1},
{"c":11,"q":"Sauvignon Blanc labelled Touraine AOC is typically:","o":["Blended with Chardonnay","Sweet","Complex and age-worthy","Fruity and inexpensive"],"a":3,"e":"Touraine AOC covers a wider area west of Sancerre and Pouilly-Fumé. Its wines are typically fruity and inexpensive.","x":1},
{"c":11,"q":"Compared with Loire Sauvignon Blanc, a typical Marlborough Sauvignon Blanc is:","o":["More subtle and neutral, with wet stones and citrus","Sweeter, with riper tropical fruit and low acidity","Always oaked, with vanilla, smoke and butter","More pronounced, with green pepper and passion fruit"],"a":3,"e":"Marlborough often blends across sites and ripeness levels, giving lemon, peach and passion fruit alongside pronounced herbaceous notes.","x":1},
{"c":11,"q":"In which Australian region is Sauvignon Blanc the most widely planted grape?","o":["Coonawarra","Hunter Valley","Adelaide Hills","Barossa Valley"],"a":2,"e":"Adelaide Hills is cooled by altitude and ocean breezes. Some Sauvignon Blancs there are blended with Semillon for more body and ageing potential.","x":1},
{"c":11,"q":"Which South African region is often cited as the coolest in the country and is cooled by altitude?","o":["Elgin","Stellenbosch","Constantia","Western Cape inland"],"a":0,"e":"Elgin's Sauvignon Blanc shows green apple and sometimes wet stones. Constantia, cooled by Southern Ocean breezes, gives riper tropical and herbaceous styles.","x":1},
{"c":11,"q":"How do the best Californian Sauvignon Blancs keep their acidity and herbaceous aromas?","o":["They are blended with Riesling for extra acidity","They are fermented at very high temperatures","They come from the hot, irrigated Central Valley","They come from cooler areas and may be picked early"],"a":3,"e":"California is mostly too warm for the classic style, so the best come from cooler spots, are sometimes picked early, and may see some oak (smoke).","x":1},
{"c":11,"q":"Very good Graves and Pessac-Léognan whites develop which flavours in bottle?","o":["Honey and nuts","Unattractive vegetal notes","Petrol and lime","Leather and earth"],"a":0,"e":"These blends of Sauvignon Blanc and Sémillon are often oak-matured and develop honey and nuts with bottle age.","x":1},
{"c":12,"q":"Pinot Grigio and Pinot Gris are:","o":["Two different grape varieties","A white and a rosé version of Pinot Noir","Names for the same grape used only in Alsace","Two names for the same grape: Italian and French"],"a":3,"e":"Pinot Grigio is the Italian name, Pinot Gris the French one. Its two styles come mainly from grape-growing and harvest choices.","x":1},
{"c":12,"q":"Where in Italy can a more complex, fuller-bodied style of Pinot Grigio be found?","o":["Puglia","Piemonte","Veneto, labelled Veneto IGT","Friuli-Venezia Giulia"],"a":3,"e":"Most Italian Pinot Grigio is light and simple from the Veneto (delle Venezie DOC or Veneto IGT). Friuli-Venezia Giulia, in the north-east corner, makes a fuller style.","x":1},
{"c":12,"q":"Outside Italy and France, a producer labelling a wine 'Pinot Grigio' rather than 'Pinot Gris' is usually signalling:","o":["A sparkling wine","A sweet wine","A high-acid, light-bodied style","A full-bodied, complex style"],"a":2,"e":"Producers elsewhere use 'Grigio' for the light, crisp style and 'Gris' for the riper, fuller style.","x":1},
{"c":12,"q":"Which grape varieties are eligible for Alsace Grand Cru status?","o":["1 and 2 only","1, 2 and 3 only","1, 2, 3 and 4","2 and 4 only"],"a":1,"e":"Pinot Gris, Riesling and Gewurztraminer can be Alsace Grand Cru, and the same three can be labelled Vendanges Tardives.","x":1,"s":["Pinot Gris","Riesling","Gewurztraminer","Chardonnay"]},
{"c":12,"q":"Why do Alsace Grand Cru vineyards typically give riper, fuller-bodied wines than vineyards on the plains?","o":["They are on steep, sunny slopes in the Vosges foothills","They are irrigated through the dry summer months","They are cooled by morning fog from the Rhine","They are planted low down on the flat valley floor"],"a":0,"e":"The grand cru sites sit on steep, sunny slopes, so the grapes ripen more.","x":1},
{"c":12,"q":"How do some producers of riper Pinot Gris keep an off-dry or medium sweetness?","o":["They remove the yeasts to stop fermentation","They add oak chips during fermentation","They use the appassimento method","They fortify the wine with grape spirit"],"a":0,"e":"The light Italian style is fermented dry. Some fuller-style producers stop fermentation by removing the yeasts.","x":1},
{"c":13,"q":"Why is a Gewurztraminer fermented to dryness typically high in alcohol?","o":["It is aged in new oak barrels","It is fortified with grape spirit","It is made from grapes frozen on the vine","Its grapes build up high levels of sugar"],"a":3,"e":"More sugar in the grapes means more alcohol when fermented dry. Gewurz is full-bodied with low to medium acidity.","x":1},
{"c":13,"q":"Gewurztraminer grows best in which climates?","o":["Warm only","Moderate to warm","Cool to moderate","Hot"],"a":2,"e":"Gewurztraminer is an aromatic variety that grows best in cool to moderate climates, with Alsace its most famous region.","x":1},
{"c":13,"q":"Which best describes a typical Viognier?","o":["Dry, high acidity, light body, lemon and grapefruit","Sweet, low alcohol, light body, rose and lychee","Dry, low to medium acidity, full body, peach and apricot","Dry, high acidity, medium body, grass and asparagus"],"a":2,"e":"Viognier is mainly grown in moderate climates and makes floral, stone-fruited, full wines.","x":1},
{"c":13,"q":"What is unusual about Viognier for an aromatic grape variety?","o":["It's always sweet","Some Viogniers are oak-aged","It has very high acidity","It's always sparkling"],"a":1,"e":"Most Viognier is fermented in inert vessels, but unusually for an aromatic variety some are oak-aged. In Condrieu light vanilla is common.","x":1,"z":1},
{"c":13,"q":"Condrieu AOC is located in:","o":["The Northern Rhône","The Loire Valley","The Southern Rhône","Alsace"],"a":0,"e":"Condrieu, in the Northern Rhône, is dedicated to single-varietal Viognier.","x":1},
{"c":13,"q":"Why is Rías Baixas well suited to refreshing white wines?","o":["It is cooled by morning fog rising from a river","It is high in the mountains, with hot days and cold nights","Close to the Atlantic, it is cooler, wetter and cloudier","It is sheltered from rain by a range of mountains"],"a":2,"e":"Rías Baixas in north-west Spain is shaped by the Atlantic. Its Albariño is dry, high in acidity and medium-bodied with lemon, grapefruit, peach and apricot.","x":1},
{"c":13,"q":"Some Albariño producers use a small amount of lees contact to:","o":["Create bubbles","Make the wine sweet","Add vanilla and smoke","Add body and complexity"],"a":3,"e":"Albariño is usually unoaked and drunk young; a little lees contact sometimes adds body and complexity.","x":1},
{"c":14,"q":"Just-ripe Merlot grapes produce wines with:","o":["Light to medium body, red fruit and green bell pepper","Full body, high alcohol and cooked black fruit","High tannin, high acidity and blackcurrant","Light body, floral aromas, lychee and rose"],"a":0,"e":"Just-ripe Merlot: strawberry, red plum and green bell pepper. Riper Merlot: medium to full body with blackberry and black plum.","x":1},
{"c":14,"q":"Which best describes a single-varietal Merlot?","o":["Medium · Medium","High · Low to medium","High · High","Low · Low"],"a":0,"e":"A single-varietal Merlot is typically dry with medium acidity and medium tannins.","x":1,"h":["Acidity","Tannin"]},
{"c":14,"q":"What does Merlot contribute when blended with Cabernet Sauvignon?","o":["More tannin and acidity, for long ageing","Herbaceous, minty flavours and structure","Red fruit and lower tannin, for earlier drinking","Bubbles and freshness from early picking"],"a":2,"e":"Merlot softens a blend, adds red fruit and makes it ready earlier.","x":1},
{"c":14,"q":"How would you describe Bordeaux's climate?","o":["Hot, with very little rain","Cool and continental","Warm, dry and sunny","Moderate, with high rainfall"],"a":3,"e":"Bordeaux is moderate and wet. Vintages vary a lot, which makes blending important.","x":1},
{"c":14,"q":"Which is the most widely planted grape variety in Bordeaux?","o":["Merlot","Sauvignon Blanc","Cabernet Sauvignon","Sémillon"],"a":0,"e":"Merlot is the most widely planted variety in Bordeaux, and Bordeaux AOC and Bordeaux Supérieur AOC are typically Merlot-dominated.","x":1},
{"c":14,"q":"How does Bordeaux Supérieur AOC differ from Bordeaux AOC?","o":["Slightly stricter rules on yields, ageing and alcohol","It must come from a single named vineyard site","It must come only from vineyards on the Right Bank","It must be a white wine made mainly from Sémillon"],"a":0,"e":"Both are regional appellations covering all of Bordeaux; Supérieur has slightly stricter rules.","x":1},
{"c":14,"q":"Which districts are on Bordeaux's Left Bank?","o":["Saint-Émilion and Pomerol","Sancerre and Touraine","Médoc, Graves and Sauternes","Côte de Nuits and Côte de Beaune"],"a":2,"e":"West and south of the Gironde/Garonne: Médoc, Graves and Sauternes. North and east of the Gironde/Dordogne: Saint-Émilion and Pomerol.","x":1},
{"c":14,"q":"Which of these appellations sits within the Haut-Médoc?","o":["Pessac-Léognan AOC","Pomerol AOC","Saint-Émilion AOC","Pauillac AOC"],"a":3,"e":"The Médoc contains the Haut-Médoc, which contains Margaux and Pauillac. Graves contains Pessac-Léognan.","x":1},
{"c":14,"q":"What tertiary aromas do the best Merlot-dominated wines develop?","o":["Petrol and honey","Butter and cream","Dried fruit and tobacco","Hazelnut and mushroom"],"a":2,"e":"Outstanding Saint-Émilion and Pomerol are full-bodied with black fruit and oak, and age into dried fruit and tobacco.","x":1,"z":1},
{"c":14,"q":"Where does most of New Zealand's Merlot come from?","o":["Marlborough","Hawke's Bay","Central Otago","Martinborough"],"a":1,"e":"Hawke's Bay in the North Island is moderate with plentiful rain, making Merlot from light and fruity to full-bodied, alone or blended with Cabernet.","x":1},
{"c":15,"q":"How do the gravel soils of Bordeaux's Left Bank help Cabernet Sauvignon ripen?","o":["They shelter the vines and block cold winds","They add nutrients that speed up ripening","They hold lots of water through dry summers","They drain quickly and store the day's heat"],"a":3,"e":"Many Bordeaux sites are too cool for Cabernet. Gravel keeps roots from being cold and damp and stores heat.","x":1},
{"c":15,"q":"In a year when Cabernet Sauvignon struggles to ripen in Bordeaux, producers will often:","o":["Stop making red wine that year","Use the appassimento method","Add more Cabernet Sauvignon","Use more Merlot in the blend"],"a":3,"e":"Bordeaux weather varies a lot. Blending lets producers lean on Merlot in cooler years.","x":1},
{"c":15,"q":"What does 'Château' on a Bordeaux label indicate?","o":["The wine is made from grapes grown on the producer's own land","The wine comes from a vineyard on Bordeaux's Right Bank","The wine is made in a grand historic building on the estate","The wine has been ranked as a Grand Cru Classé in 1855"],"a":0,"e":"Château means an estate or producer whose wine is made from its own grapes, not bought-in grapes.","x":1},
{"c":15,"q":"Which Napa Valley sub-region, in the far north of the valley, is the warmest, giving some of Napa's ripest wines?","o":["Oakville","Calistoga","Rutherford","Carneros"],"a":1,"e":"Oakville and Rutherford make full-bodied Cabernet with ripe black fruit and high, ripe tannin. Calistoga in the far north is warmer still.","x":1},
{"c":15,"q":"What is Chile's most widely planted grape variety?","o":["Merlot","Chardonnay","Cabernet Sauvignon","Sauvignon Blanc"],"a":2,"e":"Cabernet Sauvignon is Chile's most widely planted variety, with Maipo and Colchagua Valleys important sub-regions of the Central Valley.","x":1},
{"c":15,"q":"Chilean Cabernet Sauvignon from vineyards in the foothills of the Andes often shows:","o":["Strawberry and white pepper, with soft tannins","Tropical fruit and butter, with low tannins","Mint and green bell pepper, with black fruit","Banana and candy, with very soft tannins"],"a":2,"e":"Maipo and Colchagua stretch from the Andes foothills to the Coastal Ranges. Foothill wines often show herbal and herbaceous notes.","x":1},
{"c":15,"q":"What tertiary flavours can very good Cabernet Sauvignon develop in bottle?","o":["Banana and candy","Hazelnut and mushroom","Dried fruit and forest floor","Petrol and honey"],"a":2,"e":"Cabernet's high tannin and acidity act as natural preservatives. Over time tannins soften and dried fruit, earth and forest floor appear.","x":1},
{"c":15,"q":"What moderates the climate of Coonawarra in South Australia?","o":["Warm ocean currents from the Caribbean","Cloud cover and cool breezes from the south","High altitude in the Mount Lofty Ranges","Morning fog rolling in from San Pablo Bay"],"a":1,"e":"Coonawarra Cabernet has mint, pronounced blackcurrant and smoke and cedar from oak, and can age for many years.","x":1},
{"c":15,"q":"In New Zealand's Hawke's Bay, Cabernet Sauvignon:","o":["Ripens easily everywhere and is usually bottled alone","Needs the warmest sites and is often blended with Merlot","Is the most widely planted grape across the region","Is used mainly as a base wine for sparkling"],"a":1,"e":"The blends show fresh red and black fruit with green bell pepper.","x":1},
{"c":16,"q":"Which describes the Syrah/Shiraz grape?","o":["A white grape","Thin-skinned with large grapes","Thick-skinned with small grapes","Needs a cool climate"],"a":2,"e":"Syrah's thick skins and small grapes give medium to high tannin and acidity.","x":1,"z":1},
{"c":16,"q":"A typical moderate-climate Syrah, such as from the Northern Rhône, is:","o":["High in acidity, with red cherry and dried herbs","Medium-bodied, with fresh black fruit and pepper","Light-bodied, with strawberry and white pepper","Full-bodied, with cooked black fruit and liquorice"],"a":1,"e":"Moderate Syrah: medium body, fresh black cherry and blackberry, herbs, pepper. Warm Shiraz: full body, high alcohol, cooked black fruit, liquorice.","x":1},
{"c":16,"q":"Outside France and Australia, what can the choice of 'Syrah' or 'Shiraz' on a label suggest?","o":["The style: Syrah fresher and peppery, Shiraz riper","The colour: Syrah pale ruby, Shiraz deep purple","Nothing: the two names are used at random","The sweetness: Syrah dry, Shiraz off-dry"],"a":0,"e":"Producers elsewhere use the name to signal which style they made.","x":1},
{"c":16,"q":"What tradition is followed by some producers in Côte-Rôtie?","o":["Drying the grapes before fermentation (appassimento)","Blending the Syrah with a large share of Grenache","Co-fermenting a little Viognier with the Syrah","Giving the wine a second fermentation in bottle"],"a":2,"e":"Côte-Rôtie is the northern limit of where Syrah ripens. Its steep, stony slopes give complex, peppery wines.","x":1},
{"c":16,"q":"How does Crozes-Hermitage AOC compare with Hermitage AOC?","o":["Smaller and steeper, with more intense wines","Further south, in the warmer Southern Rhône","Larger, but it makes white wine only","Larger and flatter, with less intense wines"],"a":3,"e":"Hermitage is one steep south-facing hill. The flatter Crozes-Hermitage around it has higher yields and can be mechanised, so prices are lower.","x":1},
{"c":16,"q":"What is the most widely planted grape variety in Australia?","o":["Shiraz","Cabernet Sauvignon","Chardonnay","Grenache"],"a":0,"e":"Shiraz is Australia's most widely planted variety; much grows in warm inland regions for inexpensive wines labelled South Eastern Australia.","x":1},
{"c":16,"q":"A typical Hunter Valley Shiraz is:","o":["Sweet and fortified, with dried fruit","Medium-bodied, with fresh black fruit and earthy notes","Light-bodied and pale, with red cherry","Full-bodied, with cooked black fruit and high alcohol"],"a":1,"e":"Hunter Valley is warm, but summer cloud cover and sea breezes slow ripening, giving a fresher style.","x":1},
{"c":16,"q":"Syrah is the only black grape variety permitted in the AOC wines of:","o":["The Northern Rhône","Minervois","The Southern Rhône","Bordeaux"],"a":0,"e":"In the Northern Rhône, Syrah stands alone among black grapes, grown on steep slopes along the narrow river valley.","x":1},
{"c":16,"q":"What tertiary flavours develop in very good Syrah/Shiraz with bottle age?","o":["Dried fruit, leather and meat","Banana, candy and bubblegum","Hazelnut, mushroom and butter","Petrol, honey and lime"],"a":0,"e":"The finest examples can age a decade or more, gaining dried fruit, leather, meat and earth.","x":1},
{"c":16,"q":"Where in the South of France might you find a single-varietal Syrah?","o":["Labelled Chablis AOC","Labelled Pays d'Oc IGP","Labelled Pomerol AOC","Labelled Hermitage AOC"],"a":1,"e":"Syrah ripens reliably in the warm South of France. It's blended into appellations like Minervois AOC or bottled alone as Pays d'Oc IGP.","x":1},
{"c":17,"q":"Some Beaujolais winemaking techniques maximise colour and minimise tannin. What aromas can they create?","o":["Vanilla and smoke","Bread and biscuit","Black pepper and liquorice","Banana and candy"],"a":3,"e":"These techniques give the classic banana and candy notes of light, fruity Beaujolais.","x":1},
{"c":17,"q":"Where is Beaujolais, and what is its climate?","o":["Directly south of Burgundy, with a moderate climate","In the Loire, with a cool climate","North of Champagne, with a cool climate","In the Southern Rhône, with a warm climate"],"a":0,"e":"Beaujolais lies just south of Burgundy and has a moderate climate.","x":1},
{"c":17,"q":"How many Beaujolais crus are there?","o":["One, Fleurie","Ten","Three","Twenty"],"a":1,"e":"Ten villages within the Beaujolais Villages area have their own appellations. Fleurie is one of the best known.","x":1},
{"c":17,"q":"Why do Beaujolais Villages AOC wines typically have more flavour intensity and body than Beaujolais AOC?","o":["Their northern vineyards have poorer, stonier soils","They are made from a different, darker grape","They come from the flat, fertile south","They are aged in new oak for longer"],"a":0,"e":"Basic Beaujolais AOC grapes come mostly from the flat, fertile south with high yields. The Villages are in the north, on poorer soils.","x":1},
{"c":17,"q":"Which statement about Gamay winemaking is true?","o":["It is usually blended with Cabernet Sauvignon","It is always aged in new oak for two years","It is usually fortified","It is usually made in inert vessels and rarely shows oak"],"a":3,"e":"Gamay wines are usually made in inert vessels. Most are for early drinking and lose their fresh fruit quickly in bottle.","x":1,"z":1},
{"c":18,"q":"What do Syrah (in France) and Tempranillo (in Spain) add when blended with Grenache?","o":["Bubbles and freshness","Colour, acidity and tannins","Extra red-fruit flavours","More sugar and alcohol"],"a":1,"e":"Grenache is high in sugar, low in acid and thin-skinned. Partners fill in colour, acidity and tannin.","x":1},
{"c":18,"q":"How do the large, round stones in Châteauneuf-du-Pape vineyards help Grenache?","o":["They shade the soil and keep the vines cool","They absorb heat by day and release it at night","They protect the vines from hail damage","They hold water in the soil through summer"],"a":1,"e":"The stones help Grenache reach full ripeness. Châteauneuf-du-Pape is known for full-bodied, high-alcohol wines.","x":1},
{"c":18,"q":"Compared with Côtes du Rhône AOC, wines labelled Côtes du Rhône Villages AOC typically offer:","o":["More flavour intensity and complexity","A light sparkle and more freshness","Less concentration and lighter body","More sweetness and lower alcohol"],"a":0,"e":"Côtes du Rhône → Côtes du Rhône Villages → Rhône crus, with intensity and complexity rising up the ladder.","x":1},
{"c":18,"q":"Besides Rioja, which Spanish region is known for dry Garnacha rosé?","o":["Rías Baixas DO","Navarra DO","Ribera del Duero DO","Priorat DOCa"],"a":1,"e":"Garnacha adds body and red fruit in Rioja and neighbouring Navarra, which is also known for dry rosé.","x":1},
{"c":18,"q":"Why do some producers prefer old oak over new oak for Grenache?","o":["Grenache's red fruit is delicate","Old oak adds more vanilla","Grenache has too much tannin","New oak is banned in the Rhône"],"a":0,"e":"Many simple Grenaches are unoaked; very good ones are often barrel-matured, sometimes in old oak to protect the delicate fruit.","x":1},
{"c":18,"q":"Which of these is a Rhône cru in the Northern Rhône?","o":["Minervois AOC","Côte Rôtie AOC","Châteauneuf-du-Pape AOC","Côtes du Rhône Villages AOC"],"a":1,"e":"Northern Rhône crus include Crozes-Hermitage, Hermitage, Côte Rôtie and Condrieu. Châteauneuf-du-Pape is in the south.","x":1},
{"c":19,"q":"How are Tempranillo-based wines traditionally matured in many parts of Spain?","o":["Under a layer of flor in a solera","In small new-oak barrels, for vanilla and cedar","In stainless steel only, to keep fruit fresh","After drying the grapes, for concentration"],"a":1,"e":"New oak adds vanilla, smoke and cedar, softens tannins and adds body. The best wines often also age in bottle before release.","x":1},
{"c":19,"q":"What must happen to a Crianza wine before release?","o":["It must have the longest ageing of all the categories","Nothing: it has no minimum ageing requirement","It must age only in bottle, never in barrel","It must be aged in oak barrels for a set time"],"a":3,"e":"Joven has no minimum ageing. Crianza must age in oak. Reserva ages in oak and bottle. Gran Reserva has the highest minimums.","x":1},
{"c":19,"q":"Which statement about Joven wines is true?","o":["They must be aged in oak barrels for at least two years","They are only made in Rioja and nowhere else in Spain","They have no minimum ageing and are released young","They have the most tertiary aromas of the four terms"],"a":2,"e":"Joven means young: fruity wines with primary flavours from the grapes.","x":1},
{"c":19,"q":"What allows Tempranillo in Ribera del Duero to make very full-bodied wines with fresh black fruit?","o":["Warm days and cool nights, inland and high","Very high yields from fertile valley soils","Cooling Atlantic fog in the mornings","Botrytis from misty autumn mornings"],"a":0,"e":"Ribera del Duero is inland and mountainous. Warm days ripen the grapes; cool nights keep the fruit fresh.","x":1},
{"c":19,"q":"Which statement about the terms Crianza, Reserva and Gran Reserva is true?","o":["They describe the altitude of the vineyard","They are Spain's PGI labelling terms","They are national Spanish terms, used anywhere","They can only be used on wines from Rioja"],"a":2,"e":"These ageing terms apply throughout Spain; some regions have stricter laws and many producers exceed the minimums.","x":1},
{"c":19,"q":"Why might a producer choose not to make a Gran Reserva in a particular vintage?","o":["The vintage was too good for long ageing","The law forbids Gran Reserva in hot years","The wine lacked the intensity for long ageing","Gran Reserva can only be made every ten years"],"a":2,"e":"Putting an inferior wine through long ageing gives a stale wine lacking fruit, so only wines with enough intensity, acidity and tannin qualify.","x":1},
{"c":19,"q":"Which statement about Rioja DOCa is true?","o":["Moderate climate, usually a blend led by Tempranillo","A hot region in southern Spain, mainly Garnacha","In north-west Spain beside the Atlantic, mainly white","Always 100% Garnacha, aged in new French oak"],"a":0,"e":"Rioja, in north-east Spain, blends Tempranillo with Garnacha for early-drinking wines and with other local grapes for colour, tannin and acidity in long-ageing wines.","x":1},
{"c":20,"q":"Why can Carmenère struggle to ripen, even in Chile?","o":["It is too sensitive to cold winters and frost","It is very prone to botrytis in wet autumns","It needs a long, sunny season, so the warmest sites","It needs a cool climate to keep its acidity"],"a":2,"e":"Carmenère can struggle to ripen in all but the warmest, sunniest sites of the Central Valley.","x":1},
{"c":20,"q":"When fully ripe, Carmenère gives flavours of:","o":["Strawberry and white pepper","Lychee and rose","Fresh blackberry and eucalyptus","Green bell pepper and tomato leaf"],"a":2,"e":"Ripe Carmenère: fresh black fruit and herbal eucalyptus. Unripe: pungent green bell pepper and tomato leaf.","x":1},
{"c":20,"q":"Where is Malbec native to?","o":["Northern Spain","Argentina","South-west France","Central Italy"],"a":2,"e":"Like Carmenère, Malbec comes from south-west France but has adapted well to South America's warmer climate.","x":1},
{"c":20,"q":"Maturation in new oak gives Malbec flavours of:","o":["Butter and cream","Coffee and chocolate","Clove and vanilla","Bread and biscuit"],"a":2,"e":"New oak softens Malbec and adds spicy clove and vanilla. Very good examples age into dried fruit and meat.","x":1},
{"c":20,"q":"Which statement about Pinotage is true?","o":["It was bred for South Africa and is related to Pinot Noir","It is a white grape used for South African sparkling wine","It is grown mainly in Argentina's high-altitude vineyards","It is native to Bordeaux and was taken to the Cape"],"a":0,"e":"Pinotage was made for South Africa's warm, dry climate. It shares Pinot Noir's red fruit, with medium tannin and high acidity.","x":1},
{"c":20,"q":"Pinotage made in contact with oak can take on pronounced aromas of:","o":["Petrol and honey","Clove and vanilla","Coffee, chocolate and smoke","Lemon and wet stones"],"a":2,"e":"Pinotage ranges from fruity medium-bodied wines to powerful full-bodied ones, and picks up coffee, chocolate and smoke from oak.","x":1},
{"c":20,"q":"Most of Argentina's Malbec is planted in:","o":["The coastal Casablanca Valley","The low, flat Central Valley","Stellenbosch","The high-altitude region of Mendoza"],"a":3,"e":"Malbec is grown widely in Argentina, but the majority is in high-altitude Mendoza.","x":1},
{"c":21,"q":"Which best describes a wine made from Cortese?","o":["Dry, full-bodied, medium acidity, peach, melon and mango","Dry, light-bodied, high acidity, blossom, apple, pear and lemon","Sweet, light-bodied, grape and peach","Dry, medium-bodied, high acidity, fennel"],"a":1,"e":"Cortese, the grape of Gavi DOCG in Piemonte, is fermented in inert vessels and not oaked.","x":1},
{"c":21,"q":"Recioto di Soave DOCG is:","o":["A dry red wine made from partially dried Corvina","A sparkling wine made from Glera in a tank","A sweet white wine made from dried grapes","A fortified wine made from Garganega"],"a":2,"e":"Recioto di Soave is made from dried Garganega grapes so the yeast can't ferment all the sugar.","x":1},
{"c":21,"q":"The best Soave Classico DOC wines can develop which flavours in bottle?","o":["Butter and vanilla","Petrol and lime","Leather and tobacco","Honey and almonds"],"a":3,"e":"Most Soave DOC is for drinking young, but the best Soave Classico gains honey and almonds.","x":1},
{"c":21,"q":"Which herbal note is characteristic of Verdicchio?","o":["Fennel","Mint","Eucalyptus","Dried herbs"],"a":0,"e":"Verdicchio: dry, high acidity, medium body, apple, pear, lemon and fennel.","x":1},
{"c":21,"q":"Verdicchio is widely planted in central Italy, particularly in which region?","o":["Piemonte, in the north-west","Campania, in the south","Marche, on the east coast","Veneto, in the north-east"],"a":2,"e":"The most famous Verdicchio wine is Verdicchio dei Castelli di Jesi DOC from the Marche.","x":1},
{"c":21,"q":"Fiano di Avellino DOCG comes from which region?","o":["Tuscany","Piemonte","Campania","Veneto"],"a":2,"e":"Fiano is an important white grape in southern Italy. Fiano di Avellino comes from mountainous Campania.","x":1},
{"c":21,"q":"Some Fiano wines show secondary aromas of bread and biscuit. Where do these come from?","o":["Lees contact","Bottle age","Malolactic conversion","Botrytis"],"a":0,"e":"Many producers ferment Fiano in inert vessels, but some show lees (bread, biscuit) or oak (smoke).","x":1},
{"c":22,"q":"What tertiary aromas do the best Nebbiolo wines develop with bottle age?","o":["Hazelnut, butter and cream","Petrol, honey and lime","Banana, candy and bubblegum","Mushroom, tobacco and leather"],"a":3,"e":"Nebbiolo's high acid and tannin let its wines improve with age, gaining mushroom, tobacco and leather.","x":1},
{"c":22,"q":"What is the landscape of the Barolo region?","o":["A horseshoe of hills with steep south-facing vineyards","A wide, flat and fertile plain beside a river","Coastal vineyards cooled by morning sea fog","A narrow river valley with steep terraced slopes"],"a":0,"e":"Barolo DOCG is 100% Nebbiolo, typically full-bodied with pronounced flavours, high tannin and acidity, and long ageing potential.","x":1},
{"c":22,"q":"Where is Barbaresco DOCG in relation to Barolo DOCG?","o":["To the north-east, and smaller","In the Veneto","In Tuscany","To the south, and larger"],"a":0,"e":"Barbaresco makes similarly powerful, long-lived Nebbiolo.","x":1},
{"c":22,"q":"Which DOCG is considered by many to make Barbera's highest-quality wines?","o":["Barbera d'Asti DOCG","Asti DOCG (Moscato)","Barolo DOCG (Nebbiolo)","Gavi DOCG (Cortese)"],"a":0,"e":"The question asks for the best wine made from the Barbera grape. Barolo is Piemonte's most famous premium wine, but it's made only from Nebbiolo, so it has no Barbera in it at all. Barbera d'Asti has the grape in its name: Barbera from Asti. The book calls it Barbera's highest-quality wine.","x":1},
{"c":22,"q":"Compared with Nebbiolo, Barbera is generally:","o":["Higher in tannin and longer-lived","Lower in acidity and softer","Lower in tannin and drunk younger","A white grape, not a black one"],"a":2,"e":"Barbera has high acidity, low to medium tannin, red cherry, red plum and sometimes black pepper.","x":1},
{"c":22,"q":"Which best describes Amarone della Valpolicella DOCG?","o":["Sparkling and dry, with fresh red cherry","Sweet, light and low in alcohol, with red fruit","Light-bodied, fruity and simple, for drinking young","Dry to off-dry, full-bodied, about 15% abv, dried fruit"],"a":3,"e":"Amarone is made from partially dried grapes (appassimento), which concentrate sugar, acid, tannin and flavour.","x":1},
{"c":22,"q":"Compared with Valpolicella DOC, Valpolicella Classico DOC typically:","o":["Is sweet, made from late-harvested grapes","Is made from partially dried grapes","Comes from the hilly heartland, with more body","Is lighter, simpler and cheaper"],"a":2,"e":"Basic Valpolicella DOC is light, fruity and simple, rarely sees new oak, and is for drinking young.","x":1},
{"c":22,"q":"How does the appassimento method work?","o":["Grapes are picked and dried indoors before fermenting","Grape spirit is added part way through fermentation","Grapes are left on the vine until they freeze solid","Grapes are left on the vine until noble rot sets in"],"a":0,"e":"Appassimento is widely used in the Veneto for Amarone and Recioto della Valpolicella, and Recioto di Soave.","x":1},
{"c":22,"q":"Recioto della Valpolicella DOCG is sweet because:","o":["Sweet grape juice is added after fermentation","The dried grapes have too much sugar to ferment dry","Grape spirit is added to stop the fermentation","It's made from grapes frozen on the vine"],"a":1,"e":"Same dried grapes as Amarone, but Recioto keeps lots of sugar, making a sweet red.","x":1},
{"c":23,"q":"How does Chianti Classico DOCG differ from the wider Chianti DOCG?","o":["It must be sweet, from late-harvested grapes","It is always simple, light and inexpensive","It is made from the Montepulciano grape","It is higher, with more pronounced fruit and herbs"],"a":3,"e":"Many Chianti DOCG wines are simple. Chianti Classico is often oak-matured (cloves, cedar) and the best gain meat and leather with age.","x":1},
{"c":23,"q":"Chianti Classico is often matured in oak, which adds flavours of:","o":["Coconut and banana","Butter and cream","Coffee and chocolate","Cloves and cedar"],"a":3,"e":"Oak softens Sangiovese's tannins and adds cloves and cedar.","x":1},
{"c":23,"q":"In Brunello di Montalcino, what is 'Brunello'?","o":["A separate grape variety","A Riserva ageing term","The name of a type of barrel","The local name for Sangiovese"],"a":3,"e":"Brunello di Montalcino comes from the warm, sunny town of Montalcino in southern Tuscany and must age in oak for an extended period before release.","x":1},
{"c":23,"q":"Which best describes a wine made from Montepulciano?","o":["Medium · Medium · Medium · Strawberry","Pale · High · Low · Red cherry","Deep · High · High · Red cherry, dried herbs","Deep · Medium · High · Black plum, black cherry"],"a":3,"e":"Montepulciano: deeply coloured, medium acidity, high tannin and black fruit. Sangiovese: high acidity, high tannin and red fruit.","x":1,"h":["Colour","Acidity","Tannin","Fruit"]},
{"c":23,"q":"Which mountains divide Tuscany, where Sangiovese dominates, from Abruzzo, where Montepulciano is widely planted?","o":["The Apennines","The Alps","The Vosges","The Andes"],"a":0,"e":"The Apennines run down Italy's spine. Tuscany lies west, Abruzzo east.","x":1},
{"c":23,"q":"Barbera d'Asti DOCG is named after:","o":["A grape variety only","A producer and a village","A region only","A grape variety and a region"],"a":3,"e":"Italian wines are named after a region (Barolo, Valpolicella) or a grape plus a region (Barbera d'Asti = 'Barbera from Asti').","x":1,"z":1},
{"c":23,"q":"Chianti Classico Riserva DOCG differs from Chianti Classico DOCG because it:","o":["It comes from a different, smaller region","It has longer minimum ageing before release","It is a sweet style made from dried grapes","It is made from Montepulciano, not Sangiovese"],"a":1,"e":"Riserva means a DOC or DOCG wine aged for at least a set number of months before release.","x":1},
{"c":24,"q":"The base wine for most sparkling wines is typically:","o":["Dry, high in acidity and low in alcohol","Dry, low in acidity and high in alcohol","Full-bodied, oaked and high in alcohol","Sweet, low in acidity and high in alcohol"],"a":0,"e":"The base wine is usually a blend of wines from different vintages, varieties and/or villages.","x":1},
{"c":24,"q":"By roughly how much does the second fermentation raise the alcohol of a sparkling wine?","o":["Not at all","About 10% abv","About 5% abv","About 1.5% abv"],"a":3,"e":"Sugar and yeast are added to the base wine; the yeast make CO₂ and about 1.5% more alcohol.","x":1},
{"c":24,"q":"In traditional-method sparkling wine, what is riddling?","o":["Turning the bottle upside down so the lees slide into the neck","Adding yeast and sugar to the base wine to start the bubbles","Adding wine and sugar to the bottle after the lees are removed","Freezing and removing the plug of lees from the bottle's neck"],"a":0,"e":"Riddling was traditionally by hand but is now mostly done by gyropalettes, which process hundreds of bottles at a time.","x":1},
{"c":24,"q":"How is disgorgement carried out?","o":["The lees are left in the bottle to keep adding flavour","The neck is frozen and pressure pushes out the plug of lees","The bottle is shaken hard until the lees dissolve","The wine is emptied into a tank and filtered"],"a":1,"e":"After riddling, the lees sit in the neck. Freezing traps them in ice, and the CO₂ pressure ejects the plug.","x":1},
{"c":24,"q":"What is the liqueur d'expédition?","o":["Grape spirit used for fortification","The yeast and sugar added for the second fermentation","The frozen plug of lees","A mixture of wine and, usually, sugar added at dosage"],"a":3,"e":"After disgorgement, the bottle is topped up with the liqueur d'expédition. The dosage decides the final sweetness.","x":1},
{"c":24,"q":"A sparkling wine labelled 'Demi-Sec' is:","o":["Medium in sweetness","Fortified","Bone dry with no sugar added","Dry"],"a":0,"e":"Brut has a very small amount of sugar but tastes dry thanks to high acidity and bubbles. Demi-Sec gets more sugar and tastes medium-sweet.","x":1},
{"c":24,"q":"Which three grape varieties are typically blended for Champagne's base wine?","o":["Pinot Noir, Gamay and Chardonnay","Glera, Chardonnay and Pinot Noir","Chardonnay, Pinot Noir and Meunier","Chardonnay, Sauvignon Blanc and Sémillon"],"a":2,"e":"Champagne's cool climate gives base wines with low alcohol and high acidity.","x":1},
{"c":24,"q":"What is the legal minimum time that Champagne must spend ageing on its lees?","o":["3 months","12 months","5 years","There is no minimum"],"a":1,"e":"The least expensive Champagnes spend the 12-month minimum and show light autolytic notes. Better ones age longer for toast and biscuit.","x":1},
{"c":24,"q":"How do Vintage Champagnes differ from non-vintage?","o":["They're made by the tank method, for fresher fruit","They're blends of several years, for consistency","They're cheaper, because they spend less time on lees","They're from one top year, with long ageing and nutty notes"],"a":3,"e":"Vintage Champagne combines pronounced apple, citrus and autolytic notes with nuts and honey from bottle age.","x":1},
{"c":24,"q":"Where is most Cava made, and from which grapes?","o":["Mainly Catalunya, from local Spanish grape varieties","North-east Italy, mainly from the Glera grape","Piemonte, mainly from the Moscato grape","Champagne, from Chardonnay, Pinot Noir and Meunier"],"a":0,"e":"Catalunya's warm climate means grapes may be picked early to keep acidity. Most Cava spends less time on lees than Champagne.","x":1},
{"c":24,"q":"Which statement about Champagne and Cava labels is true?","o":["Neither has to mention its PDO status on the label","Champagne must say AOP somewhere on the label","Cava must say DOCa somewhere on the label","Both must say 'Appellation Contrôlée' on the label"],"a":0,"e":"Champagne and Cava are among the few EU wines exempt from stating their PDO on the label.","x":1},
{"c":24,"q":"Why might a winemaker choose the tank method over bottle fermentation?","o":["To avoid autolytic flavours, and at much lower cost","It's the only way to make a dry sparkling wine","To add more biscuit and toast from the lees","It's required by law for Champagne and Cava"],"a":0,"e":"In the tank method, lees are filtered out, so the wine tastes of the base wine. It's less expensive and labour intensive.","x":1},
{"c":24,"q":"How does the Asti method make a sweet, low-alcohol sparkling wine?","o":["Grape spirit is added to the juice to stop fermentation","Juice ferments in a tank sealed part way, then is filtered","A dry base wine gets a second fermentation in the bottle","Carbon dioxide is pumped into a finished sweet wine"],"a":1,"e":"The Asti method starts with juice, not a dry base wine. Early CO₂ escapes; sealing the tank traps the rest.","x":1},
{"c":24,"q":"Prosecco DOC is typically:","o":["Dry or off-dry, light to medium body, apple and melon","Sweet, light body, pronounced blossom and grape","Dry, full body, pronounced toast and biscuit","Dry, medium body, made by the traditional method"],"a":0,"e":"Prosecco comes from north-east Italy, made mainly from Glera by the tank method.","x":1},
{"c":24,"q":"Compared with Champagne, very good bottle-fermented sparkling wines from places like California, Australia and New Zealand typically have:","o":["Much higher sweetness","Red-wine colour","Slightly riper fruit flavours","No fruit flavour at all"],"a":2,"e":"These usually come from the coolest regions, often using Chardonnay and Pinot Noir, but extra sun and warmth give riper fruit.","x":1},
{"c":25,"q":"Almost all Sherry starts as a dry base wine made from which grape?","o":["Glera","Tempranillo","Palomino","Pedro Ximénez"],"a":2,"e":"Palomino is a local white grape. Sherry comes from around Jerez de la Frontera in southern Spain.","x":1},
{"c":25,"q":"To what strength is a Fino Sherry fortified before it enters the solera?","o":["Around 12% abv","Around 17% abv","Around 15% abv","Around 20% abv"],"a":2,"e":"Fino is fortified to about 15% so flor can live on it. Oloroso goes to about 17%, where flor can't survive.","x":1},
{"c":25,"q":"How is Amontillado Sherry made?","o":["It's made from sun-dried grapes and is very sweet","It never has flor and is aged only oxidatively","It ages only under flor and stays pale","It ages under flor, then is refortified and ages oxidatively"],"a":3,"e":"Amontillado sits between Fino and Oloroso: deeper in colour than Fino, with both flor (biscuit, bread dough) and oxidative (walnut, caramel) flavours.","x":1},
{"c":25,"q":"A Sherry labelled 'Pale Cream' is:","o":["A sweetened Oloroso","Made from Pedro Ximénez only","A dry Oloroso","A sweetened Fino"],"a":3,"e":"Pale Cream = sweetened Fino. Medium and Cream are often sweetened Amontillado or Oloroso.","x":1},
{"c":25,"q":"Which statement about PX (Pedro Ximénez) Sherry is true?","o":["It ages under flor and is pale and bready","It's made from Palomino and fermented dry","It's dry and pale lemon, served chilled","It's made from sun-dried grapes and is very sweet"],"a":3,"e":"PX is fortified and aged oxidatively in the solera. It's often used to sweeten Cream Sherries.","x":1},
{"c":25,"q":"How should Fino Sherry be served and stored?","o":["At room temperature, after years of bottle ageing","Decanted like Vintage Port","Chilled, and drunk as soon as possible after bottling","Warm, as a winter drink"],"a":2,"e":"Fino is pale lemon with apple, almond and flor notes (biscuit, bread dough). After bottling it quickly loses freshness.","x":1},
{"c":25,"q":"Port is made from grapes grown in:","o":["Jerez in southern Spain","Piemonte in north-west Italy","Tokaj in north-east Hungary","The Upper Douro in Portugal"],"a":3,"e":"Port is a sweet fortified wine from a blend of local black grapes; most Ports blend several vintages.","x":1},
{"c":25,"q":"In Port production, what is the purpose of foot treading?","o":["To encourage flor to grow on the wine","To extract colour and tannin quickly","To remove the stems from the grapes","To add sweetness before fortifying"],"a":1,"e":"Port fermentation is cut short by fortification, so colour and tannin must be extracted quickly. Machines now exist for this too.","x":1,"z":1},
{"c":25,"q":"What is a Late Bottled Vintage (LBV) Port?","o":["A white Port aged in old oak casks","A blend of many vintages aged in small barrels","A Reserve Ruby style, but from a single vintage","A Tawny with a 10-year age statement"],"a":2,"e":"Ruby styles: Ruby (simple, fruity), Reserve Ruby (better wines, more intensity), LBV (Reserve Ruby style from one vintage).","x":1},
{"c":25,"q":"Ruby-style Ports are typically matured in:","o":["Only in bottle, never in wood","Large vessels, often old-oak casks","Small barrels, for several decades","Under flor, in a solera system"],"a":1,"e":"Large vessels keep Ruby Ports deeply coloured and fruity, with cooked black fruit and sometimes black pepper.","x":1},
{"c":25,"q":"Which statement about Vintage Port is true?","o":["It never throws a sediment, so needs no decanting","It's made every year from the best grapes","It's low in tannin and ready to drink on release","It's only declared in the best years and ages for decades"],"a":3,"e":"Vintage Port develops dried fruit, leather and coffee in bottle, turning from ruby to garnet.","x":1},
{"c":25,"q":"An inexpensive wine labelled simply 'Tawny Port' is typically:","o":["Aged for 40 years in small barrels","Simple, fruity and pale in colour","Dry, nutty and pale in colour","Deeply coloured and very tannic"],"a":1,"e":"The best Tawnies get their colour from long oxidative ageing in small barrels (walnut, coffee, caramel). Inexpensive Tawny is a simple, pale wine.","x":1},
{"c":25,"q":"Traditionally, why was fortification used?","o":["To lower the alcohol and soften the wine","To add bubbles and freshness to the wine","To strengthen wine and protect it from spoilage","To make wines drier and lighter in body"],"a":2,"e":"Fortification means adding alcohol. All Port is sweet because fortification stops its fermentation; most Sherry is dry, sometimes sweetened later.","x":1},
{"c":25,"q":"Sherry labelled 'Medium' or 'Cream' is usually:","o":["A sparkling, sweetened Fino","A sweetened Amontillado or Oloroso","A dry, unsweetened Fino","A sweet, fortified Port"],"a":1,"e":"Dry Sherries can be sweetened but must be labelled with a different or extra term to show it.","x":1},
{"c":15,"q":"Cabernet Sauvignon grows in which climates?","o":["Any climate, cool to hot","Moderate and warm","Cool and moderate","Cool only"],"a":1,"e":"The book says moderate and warm. Even in a moderate climate it struggles to ripen except in the warmest sites, which is why cool regions don't suit it.","x":1},
